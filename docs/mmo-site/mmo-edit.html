<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMO 배치 에디터 — 드래그로 오브젝트 배치</title>
<style>
:root{
  --bg:#0d1220; --ink:#eef2fb; --mut:#8496b3; --dim:#5d6c85;
  --panel:#131a26; --line:#28324a;
  --net:#6cc7ff; --game:#ffb648; --store:#57d694;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"Cascadia Code",Consolas,"D2Coding",monospace;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;
  -webkit-font-smoothing:antialiased; word-break:keep-all;
  background-image:radial-gradient(rgba(108,199,255,.05) 1px, transparent 1px); background-size:26px 26px}
.wrap{display:flex; gap:14px; padding:12px 16px; align-items:flex-start; max-width:1900px; margin:0 auto}
.stage{position:relative; flex:1 1 auto; min-width:0}
#scene{display:block; width:100%; height:auto; touch-action:none; user-select:none}
#scene .top{stroke:rgba(255,255,255,.18); stroke-width:1; stroke-linejoin:round}
#scene .rim{fill:none; stroke:rgba(255,255,255,.30); stroke-width:1.1; stroke-linecap:round; opacity:.55}
#scene .body{cursor:grab}
#scene .body.dragging{cursor:grabbing}
#scene .handle{cursor:grab; fill:#0d1220; stroke:var(--net); stroke-width:2; opacity:.92}
#scene .handle:hover{fill:#1b3a57}
#scene .handle.sel{fill:var(--net)}
#scene .selbox{fill:rgba(108,199,255,.08); stroke:var(--net); stroke-width:1.6; stroke-dasharray:6 4; pointer-events:none}
#scene .conn{stroke-linecap:round; pointer-events:none}
#scene .railhit{pointer-events:stroke; cursor:pointer}
#scene .wpt{fill:#0d1220; stroke:#ffb648; stroke-width:2; cursor:grab}
#scene .wpt.sel{fill:#ffb648}
#scene .ins{fill:#57d694; opacity:.5; cursor:copy}
#scene .ins:hover{opacity:1}
#scene .lblgrp{cursor:grab}
#scene .zone{cursor:grab}
#scene .zonesel{fill:none; stroke:#ffb648; stroke-width:1.6; stroke-dasharray:7 5; pointer-events:none}
#scene .zres{fill:#0d1220; stroke:#ffb648; stroke-width:2; cursor:nwse-resize}
#scene .zword{cursor:grab}
#scene .gridlyr{pointer-events:none}   /* 격자선이 그 아래 구역·바닥글자 클릭을 가로채지 않게 */

/* 사이드 패널 */
.side{flex:0 0 320px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 15px}
.side h1{font-size:1.02rem; margin:0 0 3px}
.side .sub{font-size:.78rem; color:var(--mut); margin:0 0 12px; line-height:1.5}
.side .grp{border-top:1px solid var(--line); padding:11px 0 3px}
.side .lb{font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; margin-bottom:7px}
.row{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.btn{font-family:var(--mono); font-size:.78rem; color:var(--ink); background:#1a2333; border:1px solid var(--line);
  border-radius:9px; padding:7px 11px; cursor:pointer; transition:border-color .15s}
.btn:hover{border-color:var(--net)}
.btn.pri{background:#173049; border-color:#2b6597; color:#cfe6ff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{font-family:var(--mono); font-size:.74rem; color:var(--mut); background:none; border:none; padding:6px 10px; cursor:pointer}
.seg button.on{background:#173049; color:#cfe6ff}
/* ── 구역 강조: 고른 구역만 남기고 나머지를 죽인다 ──
   죽이는 값은 본편 mmo.src.html 과 같다(같은 그림을 같은 세기로 봐야 판단이 옮겨간다).
   다만 뷰어와 달리 여기서는 클릭을 막지 않는다 — 죽은 것도 계속 집어서 편집할 수 있어야 한다.
   본편은 구역이 넷뿐이라 색 이름으로 걸렀지만, 에디터는 구역을 더 만들 수 있어(색이 겹칠 수 있다)
   구역 id 로 가른다. id 는 정해진 목록이 아니라서 CSS 선택자로는 못 거르고 JS 가 class 를 붙인다. */
:root{ --zdim:saturate(.16) brightness(.40) }
#scene .zdim{filter:var(--zdim); transition:filter .35s ease}
.zbar{display:flex; flex-wrap:wrap; gap:4px}
.zb{display:flex; align-items:center; gap:5px; font-size:.74rem; font-weight:700; color:var(--mut);
  background:#1a2333; border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer;
  transition:border-color .15s, color .15s, background .15s}
.zb:hover{border-color:var(--net); color:var(--ink)}
.zb.act{background:#173049; border-color:#2b6597; color:#cfe6ff}
.zb i{width:8px; height:8px; border-radius:50%; flex:0 0 auto; opacity:.9}
label.ck{font-size:.8rem; color:var(--mut); display:flex; align-items:center; gap:6px; cursor:pointer}
textarea{width:100%; height:180px; resize:vertical; background:#0b111d; color:#cfe0f2; border:1px solid var(--line);
  border-radius:9px; font-family:var(--mono); font-size:.72rem; line-height:1.5; padding:9px 10px; transition:border-color .2s, box-shadow .2s}
textarea.flash{border-color:#57d694; box-shadow:0 0 0 2px rgba(87,214,148,.35)}
.hint{font-size:.74rem; color:var(--dim); line-height:1.55}
.hint b{color:var(--mut)}
.sel-name{font-family:var(--mono); font-size:.82rem; color:var(--game); min-height:1.2em}
.coord{font-family:var(--mono); font-size:.74rem; color:var(--mut)}
.prop{margin-top:6px}
.prop .fld{display:flex; align-items:center; gap:6px; margin:6px 0; font-size:.78rem; color:var(--mut)}
.prop .fld>span{flex:0 0 34px}
.prop .row .fld>span{flex:0 0 22px}
.prop .fld input, .prop .fld select{flex:1 1 auto; min-width:0; background:#0b111d; color:#cfe0f2;
  border:1px solid var(--line); border-radius:7px; padding:5px 7px; font-family:var(--mono); font-size:.74rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <!-- 본편과 같은 프레이밍(오른쪽 259칸은 상세카드 자리로 비워 둔 열) -->
    <svg id="scene" viewBox="259 172 1042 500" role="img" aria-label="배치 에디터"></svg>
  </div>
  <aside class="side">
    <h1>배치 에디터</h1>
    <p class="sub">오브젝트를 <b>끌어서</b> 배치하세요. 진짜 레일은 배치 확정 후 다시 맞춥니다. 이 파일은 실제 다이어그램과 분리돼 있어 안전합니다.</p>

    <div class="grp">
      <div class="lb">선택</div>
      <div class="sel-name" id="selName">— 없음 —</div>
      <div class="coord" id="selCoord"></div>
    </div>

    <div class="grp">
      <div class="lb">새 오브젝트 / 편집</div>
      <div class="row">
        <button class="btn pri" id="addBox">+ 상자 추가</button>
        <button class="btn" id="addRail">＋ 레일 잇기</button>
        <button class="btn" id="addZone">＋ 구역 바닥</button>
      </div>
      <div class="hint" style="margin:4px 0 2px">‘레일 잇기’ → 오브젝트 <b>두 개</b> 차례로 클릭 = 연결. 레일·상자 클릭하면 선택(편집·삭제).</div>
      <div id="propBox" class="prop"></div>
    </div>

    <div class="grp">
      <div class="lb">격자 간격 (스냅)</div>
      <div class="row">
        <div class="seg" id="snapSeg">
          <button data-snap="10">10</button>
          <button data-snap="20" class="on">20</button>
          <button data-snap="40">40</button>
          <button data-snap="0">off</button>
        </div>
      </div>
      <div class="row">
        <label class="ck"><input type="checkbox" id="showGrid" checked> 격자 보기</label>
        <label class="ck"><input type="checkbox" id="showConn" checked> 연결선</label>
        <label class="ck"><input type="checkbox" id="showZone" checked> 구역 바닥·이름</label>
      </div>
      <div class="lb" style="margin-top:2px">구역 강조</div>
      <!-- 버튼은 현재 ZONES 에서 만들어진다(구역을 추가·삭제·개명하면 따라온다) -->
      <div class="zbar" id="zonebar"></div>
      <div class="hint" style="margin-top:6px">고른 구역만 남기고 나머지를 죽입니다. 죽은 것도 그대로 집어서 편집됩니다.</div>
    </div>

    <div class="grp">
      <div class="lb">조작</div>
      <div class="row">
        <button class="btn" id="reset">처음으로</button>
        <button class="btn" id="snapAll">격자 정렬</button>
        <button class="btn pri" id="export">Export ▸</button>
      </div>
      <div class="row" style="margin-top:2px">
        <button class="btn" id="saveFile">💾 저장(.json)</button>
        <label class="btn" for="loadFile" style="cursor:pointer; display:inline-block">📂 불러오기</label>
        <input type="file" id="loadFile" accept=".json,application/json" style="display:none">
      </div>
      <div class="hint" id="exportMsg" style="min-height:1.3em">Export = 클립보드 복사(저에게 붙여넣기용) · 저장(.json) = 내 PC에 파일로 보관/재불러오기.</div>
    </div>

    <div class="grp">
      <div class="lb">좌표 (LAYOUT)</div>
      <textarea id="out" readonly spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="copy">복사</button>
        <span class="hint" id="copyMsg"></span>
      </div>
    </div>
  </aside>
</div>

<script>
"use strict";
(function(){
const SVGNS="http://www.w3.org/2000/svg";
const svg=document.getElementById("scene");
function el(t,a,txt){ const e=document.createElementNS(SVGNS,t);
  if(a) for(const k in a) e.setAttribute(k,a[k]);
  if(txt!=null) e.textContent=txt; return e; }

/* ── 아이소 투영 (원본과 동일) ── */
const KX=0.86, KY=0.46, OX=560, OY=560;
const px=(u,v)=>OX+(u-v)*KX;
const py=(u,v,z)=>OY-(u+v)*KY-(z||0);
const P=(u,v,z)=>px(u,v).toFixed(1)+","+py(u,v,z).toFixed(1);
function poly(pts,fill,extra){ return el("polygon",Object.assign(
  {points:pts.map(p=>P(p[0],p[1],p[2]||0)).join(" "),fill},extra||{})); }
function prism(g,u,v,w,d,z0,h,c,rim){ const t=z0+h;
  g.appendChild(poly([[u,v,t],[u+w,v,t],[u+w,v,z0],[u,v,z0]],c[2]));
  g.appendChild(poly([[u,v,t],[u,v+d,t],[u,v+d,z0],[u,v,z0]],c[1]));
  g.appendChild(poly([[u,v,t],[u+w,v,t],[u+w,v+d,t],[u,v+d,t]],c[0],{class:"top"}));
  if(rim) g.appendChild(el("polyline",{class:"rim",
    points:[[u+w,v,t],[u+w,v+d,t],[u,v+d,t]].map(p=>P(p[0],p[1],p[2])).join(" ")})); }
function shadow(g,u,v,w,d){ g.appendChild(el("ellipse",
  {cx:px(u+w/2,v+d/2), cy:py(u+w/2,v+d/2,0)+5, rx:(w+d)*.38, ry:(w+d)*.13, fill:"#04060c", opacity:.36})); }

/* ── 팔레트 (현재 다이어그램 = 롤백본) ── */
const SLATE=["#3a4763","#1a2234","#232d44"];
const GAME =["#f4c862","#7d5a1c","#b3842a"];
const CROWD=["#4f7cb4","#1e3a54","#2d5276"];
const NET  =["#63afe6","#1b4870","#2b6597"];
const DBBOX=["#3f8f68","#154029","#1f5f40"];
const TRAY =["#243c5e","#0f1d31","#172a44"];
const RECV="#6cc7ff", SEND="#ffb648", STORE="#57d694";

/* ── 구역 바닥(스레드 그룹) — 얕은 판 + 앞·오른쪽 테두리 + 바닥에 눕힌 이름. 모든 것 뒤에 깔린다.
   name = 바닥에 눕혀 찍는 글자 · lu,lv = 그 글자의 중앙(따로 끌어서 자리 잡음)
   ws = 글자 크기 · wo = 진하기(0~1). 자리는 건물·레일에 안 걸리는 빈 줄을 골라 잡은 기본값 ── */
const ZPAL={ net:  {top:"#111a2b",side:"#0b111d",edge:"#6cc7ff"},
             game: {top:"#1b1710",side:"#131009",edge:"#ffb648"},
             store:{top:"#0f1b17",side:"#0a1210",edge:"#57d694"},
             /* gray 는 바탕색과 거의 같아 안 보였다 → 확실히 밝은 중립으로 */
             gray: {top:"#18202f",side:"#111827",edge:"#93a5c2"},
             /* 수신/응답/저장 3색과 안 겹치는 4번째 색조 (현재 쓰는 구역 없음) */
             violet:{top:"#1b1533",side:"#120e24",edge:"#a78bfa"},
             /* outside = 우리 서버 밖(클라이언트 등). 실선·밝은 중립.
                점선 버전이 필요하면 여기에 dash:true 만 붙이면 된다 */
             outside:{top:"#161d2b",side:"#0f1522",edge:"#93a5c2"} };
/* 글자를 +u 방향(화면 오른쪽 위)으로 눕힌다 — 이 방향은 글자 길이가 판의 폭(w) 을 먹는다.
   클라(120)·네트워크(200) 판은 폭이 깊이(320)보다 좁아 그만큼 글자를 줄여야 한다(CLIENT 26).
   판 위는 건물·레일·이름표가 꽉 차 있어 넷 다 판 밖으로 뺐고, 두 줄로 lv 를 맞춰 뒀다:
   뒤 줄(251) = NETWORK·DATA BASE, 앞 줄(-132) = GAME(뒤가 저장 판이라 앞)·CLIENT(뒤면 NETWORK 와 붙어 읽힘).
   판을 벗어난 덕에 크기를 40~50 까지 올릴 수 있다.
   ※ 같은 줄끼리는 가로로 붙으면 한 문장처럼 읽힌다. 뒤 줄이 특히 빠듯해서(글자 합 450.7 > 두 판 폭 440)
     lu 를 판 중앙이 아니라 바깥으로 30 씩 민 값(110/400)이다 — 글자를 키우면 여기부터 다시 볼 것. */
const ZONE_INIT=[
  {u:-100,v:-100,w:120,d:320,color:"outside",name:"CLIENT",  lu:-28,lv:-132, ws:40, wo:.3},
  {u:40, v:-100,w:200,d:320,color:"net",   name:"NETWORK", lu:110,lv:251, ws:40, wo:.3},
  {u:262,v:-98, w:200,d:200,color:"game",  name:"GAME",    lu:354,lv:-132, ws:50, wo:.3},
  {u:260,v:120, w:220,d:100,color:"store", name:"DATA BASE", lu:400,lv:251, ws:40, wo:.3} ];
/* 바닥에 눕힌 글자 — (u,v) 평면에 얹는 아핀 변환. 진행 방향은 +u(화면 오른쪽 위), 글자 아래쪽은 -v.
   ※ 바닥에서 똑바로 읽히는 방향은 +u 와 -v 둘뿐 — 나머지로 돌리면 거꾸로 서거나 좌우가 뒤집힌다. */
const ZW_LS=.04;   /* 자간(em) — 여기 한 줄로 네 구역 글자 간격이 같이 움직인다 */
function floorMat(u,v){ return "matrix("+KX+","+(-KY)+","+KX+","+KY+","+px(u,v).toFixed(2)+","+py(u,v,0).toFixed(2)+")"; }
/* 레일 표현(초기 디자인) — 폭 있는 바닥 채널 + 이음선. 본편 mmo.src.html 과 동일 */
const LTINT={recv:"#16243a", send:"#2a2412", store:"#12281c"};
/* 본편과 동일 — 줄별 평행 경로(꺾임은 마이터). cross 면 꺾일 때마다 부호를 뒤집어 X 로 겹친다 */
function offsetPath(wp,off,cross){
  if(!off) return wp.slice();
  const L=[]; let k=0;
  for(let i=1;i<wp.length;i++){ const a=wp[i-1], b=wp[i];
    const du=b[0]-a[0], dv=b[1]-a[1], l=Math.hypot(du,dv); if(l<0.5) continue;
    const o = cross ? (k%2 ? -off : off) : off; k++;
    const ou=-dv/l*o, ov=du/l*o;
    L.push({p:[a[0]+ou,a[1]+ov], q:[b[0]+ou,b[1]+ov], d:[du/l,dv/l]}); }
  if(!L.length) return wp.slice();
  const out=[L[0].p];
  for(let i=1;i<L.length;i++){ const A=L[i-1], B=L[i];
    const cr=A.d[0]*B.d[1]-A.d[1]*B.d[0];
    if(Math.abs(cr)<1e-6){ out.push(B.p); continue; }
    const t=((B.p[0]-A.p[0])*B.d[1]-(B.p[1]-A.p[1])*B.d[0])/cr;
    out.push([A.p[0]+A.d[0]*t, A.p[1]+A.d[1]*t]); }
  out.push(L[L.length-1].q);
  return out; }
/* 본편과 동일 — 폴리라인 하나를 통째로 띠로. knee 반경 안쪽에만 밑그림자(겹침에서 위/아래 구분) */
const XSHADE=.45, XSHADE_R=38, XSHADE_W=2.5;
function ribbon(g,pts,w,tint,knee){ const S=[], h=w/2;
  if(knee) knee.forEach(function(C){ const hs=h+XSHADE_W;
    for(let i=1;i<pts.length;i++){ const A=pts[i-1], B=pts[i];
      const du=B[0]-A[0], dv=B[1]-A[1], L=Math.hypot(du,dv); if(L<0.5) continue;
      const ux=du/L, uy=dv/L, wx=A[0]-C[0], wy=A[1]-C[1];
      const b=wx*ux+wy*uy, c=wx*wx+wy*wy-XSHADE_R*XSHADE_R, disc=b*b-c; if(disc<=0) continue;
      const t0=Math.max(0,-b-Math.sqrt(disc)), t1=Math.min(L,-b+Math.sqrt(disc)); if(t1<=t0) continue;
      const P0=[A[0]+ux*t0,A[1]+uy*t0], P1=[A[0]+ux*t1,A[1]+uy*t1], pu=-uy, pv=ux;
      g.appendChild(poly([[P0[0]+pu*hs,P0[1]+pv*hs],[P1[0]+pu*hs,P1[1]+pv*hs],
        [P1[0]-pu*hs,P1[1]-pv*hs],[P0[0]-pu*hs,P0[1]-pv*hs]],"#05080f",{opacity:String(XSHADE)})); } });
  for(let i=1;i<pts.length;i++){ const A=pts[i-1], B=pts[i];
    const du=B[0]-A[0], dv=B[1]-A[1], L=Math.hypot(du,dv); if(L<0.5) continue;
    S.push({A,B,L,pu:-dv/L,pv:du/L}); }
  S.forEach(s=>g.appendChild(poly([[s.A[0]+s.pu*h,s.A[1]+s.pv*h],[s.B[0]+s.pu*h,s.B[1]+s.pv*h],
    [s.B[0]-s.pu*h,s.B[1]-s.pv*h],[s.A[0]-s.pu*h,s.A[1]-s.pv*h]],tint)));
  for(let i=1;i<pts.length-1;i++){ const q=pts[i];
    g.appendChild(poly([[q[0]-h,q[1]-h],[q[0]+h,q[1]-h],[q[0]+h,q[1]+h],[q[0]-h,q[1]+h]],tint)); }
  S.forEach(s=>{ const upSign = py(s.A[0]+s.pu,s.A[1]+s.pv,0)<=py(s.A[0]-s.pu,s.A[1]-s.pv,0) ? 1 : -1;

const gZoneL=el("g"), gGrid=el("g"), gConn=el("g"), gBody=el("g"), gSel=el("g"), gGuide=el("g"), gLbl=el("g"), gHandle=el("g");
[gZoneL,gGrid,gConn,gBody,gSel,gGuide,gLbl,gHandle].forEach(g=>svg.appendChild(g));
gGrid.setAttribute("class","gridlyr");

let SNAP=20, showConn=true, showGrid=true, showZone=true, sel=null, selRail=null, selWpt=null, selZone=null, activeGuides=[], connectMode=false, connectFrom=null;
/* ── 구역 강조 ── hiZone="" 이면 전체(아무것도 안 죽임) */
let hiZone="";
/* 노드가 어느 구역 판 위에 서 있는지 = LAYOUT 좌표가 그 판 사각형 안인지.
   본편 mmo.src.html 의 zoneOf 와 같은 판정인데 돌려주는 값이 색이 아니라 구역 id 다 —
   에디터는 구역을 더 만들 수 있어 색이 겹칠 수 있다(본편은 네 구역이 색으로 유일). */
function zoneOfNode(name){ const L=LAYOUT[name]; if(!L) return "";
  for(let i=0;i<ZONES.length;i++){ const z=ZONES[i];
    if(L.u>=z.u&&L.u<=z.u+z.w&&L.v>=z.v&&L.v<=z.v+z.d) return z.id; }
  return ""; }
/* 레일은 양 끝 중 하나라도 그 구역이면 살아 있어야 한다 — 구역 밖으로 나가는 흐름이 보이라고 */
function zonesOfRail(r){ const a=zoneOfNode(r.a), b=zoneOfNode(r.b);
  return a===b ? a : [a,b].filter(Boolean).join(" "); }
/* render() 가 요소를 매번 새로 만들므로 여기서는 붙이기만 하면 된다(뗄 것이 없다) */
function applyZoneHi(){
  if(hiZone && !ZONES.some(z=>z.id===hiZone)) hiZone="";   /* 지운 구역을 가리키고 있으면 전체로 */
  if(!hiZone) return;
  [gZoneL,gConn,gBody,gLbl].forEach(function(layer){
    [].slice.call(layer.querySelectorAll("[data-z]")).forEach(function(e){
      if((" "+e.getAttribute("data-z")+" ").indexOf(" "+hiZone+" ")<0) e.classList.add("zdim"); }); }); }
const GUIDE_EPS=4;
function foot(n){ const L=LAYOUT[n.name]; const h=n.hit; return [L.u+h[0], L.v+h[1], h[2], h[3]]; }
function center(n){ const f=foot(n); return [f[0]+f[2]/2, f[1]+f[3]/2]; }
function snapPt(u,v){ if(SNAP<=0) return {u:Math.round(u),v:Math.round(v)};
  return {u:(Math.round(u/SNAP-0.5)+0.5)*SNAP, v:(Math.round(v/SNAP-0.5)+0.5)*SNAP}; }  /* 도형 중앙과 같은 '칸 중앙' 격자 */
function railPath(r){ const oa=byName[r.a], ob=byName[r.b], A=oa?center(oa):[0,0], B=ob?center(ob):[0,0];
  return [A].concat((r.pts||[]).map(p=>[p.u,p.v])).concat([B]); }
/* 중앙을 격자 '칸 한가운데'로 스냅 → 도형이 네모 칸 안에 딱 앉음 */
function snapBase(n,u,v){ if(SNAP<=0) return {u:Math.round(u),v:Math.round(v)};
  const cox=n.hit[0]+n.hit[2]/2, coy=n.hit[1]+n.hit[3]/2;
  const cu=(Math.round((u+cox)/SNAP-0.5)+0.5)*SNAP, cv=(Math.round((v+coy)/SNAP-0.5)+0.5)*SNAP;
  return {u:Math.round(cu-cox), v:Math.round(cv-coy)}; }

function drawGrid(){ if(!showGrid||SNAP<=0) return;
  for(let u=Math.ceil(GU0/SNAP)*SNAP; u<=GU1; u+=SNAP){ const mj=(Math.round(u)%(SNAP*5)===0);
    gGrid.appendChild(el("line",{x1:px(u,GV0),y1:py(u,GV0,0),x2:px(u,GV1),y2:py(u,GV1,0),
      stroke:mj?"#324a6b":"#1b2740","stroke-width":mj?1:.8,opacity:mj?.65:.42})); }
  for(let v=Math.ceil(GV0/SNAP)*SNAP; v<=GV1; v+=SNAP){ const mj=(Math.round(v)%(SNAP*5)===0);
    gGrid.appendChild(el("line",{x1:px(GU0,v),y1:py(GU0,v,0),x2:px(GU1,v),y2:py(GU1,v,0),
      stroke:mj?"#324a6b":"#1b2740","stroke-width":mj?1:.8,opacity:mj?.65:.42})); } }

/* 구역 이름을 바닥에 눕혀 그린다. 얇은 글자도 잡히게 글자 크기만 한 투명 판을 깔아 둔다.
   글자는 건물보다 아래라 가려질 수 있는데, 가려지면 클릭도 안 잡혀 다시 못 끌어낸다 →
   선택된 구역은 맨 위 레이어에 같은 자리로 '잡이판 + 점선'을 하나 더 얹어 항상 끌 수 있게 한다. */
function drawZoneWord(zg,z,pal){
  const s=+z.ws||24, ls=ZW_LS*s, mat=floorMat(z.lu,z.lv);
  const wg=el("g",{class:"zword","data-zword":z.id,transform:mat});
  zg.appendChild(wg);
  const t=el("text",{x:(ls/2).toFixed(1),y:(s*.34).toFixed(1),"text-anchor":"middle",
    "font-size":s,"font-weight":"900","letter-spacing":ls.toFixed(2),
    "font-family":"var(--sans)",fill:pal.edge,opacity:(z.wo!=null?z.wo:.22)},z.name);
  wg.appendChild(t);
  const tl=t.getComputedTextLength();
  const box={x:(-tl/2+ls/2).toFixed(1), y:(-s*.76).toFixed(1), width:tl.toFixed(1), height:(s*1.02).toFixed(1)};
  wg.insertBefore(el("rect",Object.assign({fill:"transparent"},box)),t);
  if(selZone===z.id){
    const hg=el("g",{class:"zword","data-zword":z.id,transform:mat});
    hg.appendChild(el("rect",Object.assign({fill:"transparent"},box)));
    hg.appendChild(el("rect",Object.assign({fill:"none",stroke:"#ffb648",
      "stroke-width":1,"stroke-dasharray":"4 3",opacity:.75},box)));
    gHandle.appendChild(hg); }
}

function render(){
  gZoneL.textContent=""; gGrid.textContent=""; gConn.textContent=""; gBody.textContent=""; gSel.textContent=""; gGuide.textContent=""; gLbl.textContent=""; gHandle.textContent="";
  /* 구역 바닥 (맨 뒤 · 격자보다도 아래) */
  if(showZone) ZONES.forEach(z=>{ const pal=ZPAL[z.color]||ZPAL.net;
    const zg=el("g",{class:"zone","data-zone":z.id,"data-z":z.id});   /* data-zone=클릭 대상 · data-z=구역 강조용 */
    prism(zg,z.u,z.v,z.w,z.d,-6,6,[pal.top,pal.side,pal.side]);
    const eAttr=pal.dash?{"stroke-dasharray":"6 5"}:{};

    if(z.name) drawZoneWord(zg,z,pal);   /* 판과 같은 그룹 = 레일·건물보다 아래(본편과 동일) */
    if(selZone===z.id){
      gSel.appendChild(el("polygon",{class:"zonesel",points:
        [[z.u,z.v],[z.u+z.w,z.v],[z.u+z.w,z.v+z.d],[z.u,z.v+z.d]].map(q=>P(q[0],q[1],0)).join(" ")}));
      gHandle.appendChild(el("rect",{class:"zres","data-zres":z.id,
        x:(px(z.u+z.w,z.v+z.d)-5).toFixed(1),y:(py(z.u+z.w,z.v+z.d,0)-5).toFixed(1),
        width:10,height:10,rx:2})); }

  /* 선택 도형이 놓인 격자 칸 강조(딱 맞음 확인) */

    const u0=Math.floor(c[0]/SNAP)*SNAP, v0=Math.floor(c[1]/SNAP)*SNAP;
    gGrid.appendChild(el("polygon",{points:[[u0,v0],[u0+SNAP,v0],[u0+SNAP,v0+SNAP],[u0,v0+SNAP]].map(p=>P(p[0],p[1],0)).join(" "),
      fill:"rgba(108,199,255,.12)",stroke:"#6cc7ff","stroke-width":1})); }
  /* 정렬 가이드(드래그 중, 다른 오브젝트 중앙선과 정렬되면 표시) */
  activeGuides.forEach(g=>{ const p=(g[0]==="u")?[[g[1],GV0],[g[1],GV1]]:[[GU0,g[1]],[GU1,g[1]]];
    gGuide.appendChild(el("line",{x1:px(p[0][0],p[0][1]),y1:py(p[0][0],p[0][1],0),

  if(showConn) RAILS.forEach(r=>{ if(!byName[r.a]||!byName[r.b]) return;
    const path=railPath(r), col=railColorHex(r.color), on=(selRail===r.id);
    const ptsStr=path.map(p=>px(p[0],p[1]).toFixed(1)+","+py(p[0],p[1],0).toFixed(1)).join(" ");
    /* 레일 하나 = 그룹 하나. 예전엔 조각들을 gConn 에 평평하게 쌓아 레일 단위로 고를 수가 없었다.
       구역 강조가 레일을 통째로 죽이고 살려야 해서 묶는다. 히트선(data-rail)은 그룹 안에 있어도 그대로 잡힌다. */

    const NL=r.lanes||1, subW=NL>1?SUB_W:LANE_W, totW=NL>1?NL*SUB_W+(NL-1)*SUB_GAP:LANE_W;

      if(on) rg.appendChild(el("polyline",{class:"conn",points:ptsStr,fill:"none",stroke:col,

      rg.appendChild(el("polyline",{class:"railhit","data-rail":r.id,points:ptsStr,fill:"none",

        [s.B[0]+s.pu*(c-h),s.B[1]+s.pv*(c-h)],[s.A[0]+s.pu*(c-h),s.A[1]+s.pv*(c-h)]],tint)); }));
    for(let i=1;i<path.length-1;i++){ const q=path[i], h=totW/2;

    const H=totW/2-1;   /* 이음선(완화) + 채널 모서리 음영(그루브) — 본편과 동일 */
    segs.forEach(s=>{ const hu=s.pu*H, hv=s.pv*H;
      for(let d=SEAM; d<s.L-2; d+=SEAM){ const t=d/s.L, cu=s.A[0]+s.du*t, cv=s.A[1]+s.dv*t;
        rg.appendChild(el("line",{x1:px(cu+hu,cv+hv),y1:py(cu+hu,cv+hv,0),
          x2:px(cu-hu,cv-hv),y2:py(cu-hu,cv-hv,0),stroke:"#3a4864","stroke-width":1,opacity:.22})); } });
    segs.forEach(s=>{ const upSign=py(s.A[0]+s.pu,s.A[1]+s.pv,0)<=py(s.A[0]-s.pu,s.A[1]-s.pv,0)?1:-1;
      offs.forEach(c=>{ [[1,true],[-1,false]].forEach(q=>{ const e=c+q[0]*upSign*subW/2, up=q[1];
        rg.appendChild(el("line",{x1:px(s.A[0]+s.pu*e,s.A[1]+s.pv*e),y1:py(s.A[0]+s.pu*e,s.A[1]+s.pv*e,0),
          x2:px(s.B[0]+s.pu*e,s.B[1]+s.pv*e),y2:py(s.B[0]+s.pu*e,s.B[1]+s.pv*e,0),

    if(on) rg.appendChild(el("polyline",{class:"conn",points:ptsStr,fill:"none",stroke:col,

    rg.appendChild(el("polyline",{class:"railhit","data-rail":r.id,points:ptsStr,fill:"none",stroke:"transparent","stroke-width":Math.max(14,totW+6)}));
    gConn.appendChild(rg); });
  /* 노드: 뒤→앞 정렬(u+v 큰 것 먼저) */
  const order=allObjs().slice().sort((p,q)=>{ const a=LAYOUT[p.name],b=LAYOUT[q.name];

  if(connectFrom && byName[connectFrom]){ const cc=center(byName[connectFrom]);

  if(selRail){ const r=RAILS.find(x=>x.id===selRail);
    if(r && byName[r.a] && byName[r.b]){ const path=railPath(r);
      (r.pts||[]).forEach((p,i)=>{ const on=(selWpt&&selWpt.rail===r.id&&selWpt.idx===i);

      for(let s=0;s<path.length-1;s++){ const m=[(path[s][0]+path[s+1][0])/2,(path[s][1]+path[s+1][1])/2];
        gHandle.appendChild(el("circle",{class:"ins","data-ins":r.id+":"+s,cx:px(m[0],m[1]),cy:py(m[0],m[1],0),r:5})); } } }

  syncOut();
}

/* ── 구역 강조 버튼 — 목록이 고정이 아니라 현재 ZONES 에서 만든다(추가·삭제·개명·색변경을 따라감).
   render() 는 드래그 중 매 프레임 불리므로, 버튼은 실제로 달라졌을 때만 다시 그린다. ── */
const zbarEl=document.getElementById("zonebar");

let zbarSig=null;
function syncZoneBar(){
  const sig=ZONES.map(z=>z.id+":"+z.name+":"+z.color).join("|")+"#"+hiZone;
  if(sig===zbarSig) return; zbarSig=sig;
  let h='<button type="button" class="zb'+(hiZone?"":" act")+'" data-z="">전체</button>';
  ZONES.forEach(function(z){ const pal=ZPAL[z.color]||ZPAL.net;
    h+='<button type="button" class="zb'+(hiZone===z.id?" act":"")+'" data-z="'+esc(z.id)+'">'
      +'<i style="background:'+esc(pal.edge)+'"></i>'+esc(z.name||z.id)+'</button>'; });
  zbarEl.innerHTML=h; }
zbarEl.addEventListener("click",function(e){
  const b=e.target.closest(".zb"); if(!b) return;
  const z=b.getAttribute("data-z")||"";
  hiZone=(hiZone===z)?"":z;   /* 같은 버튼을 다시 누르면 전체로 */

/* ── 드래그 ── */
let drag=null;
function svgScale(){ const r=svg.getBoundingClientRect(); return 1042/r.width; } /* viewBox폭/픽셀폭 */
svg.addEventListener("pointerdown",e=>{
  const wptHit=e.target.closest("[data-wpt]");

  const lblHit=e.target.closest("[data-lbl]");
  const objHit=e.target.closest("[data-name]");
  const railHit=e.target.closest("[data-rail]");
  const zresHit=e.target.closest("[data-zres]");
  const zwordHit=e.target.closest("[data-zword]");
  const zoneHit=e.target.closest("[data-zone]");
  /* 레일 잇기 모드: 오브젝트 두 개를 차례로 클릭 */
  if(connectMode){
    if(objHit){ const nm=objHit.getAttribute("data-name");
      if(!connectFrom){ connectFrom=nm; render(); }
      else if(nm!==connectFrom){ const id=addRail(connectFrom,nm,"recv");
        connectFrom=null; setConnect(false); sel=null; selRail=id; selWpt=null; renderProp(); render(); }
    } else { setConnect(false); }   /* 빈 곳 = 취소 */
    return;
  }
  /* ── 구역 바닥: 크기조절 핸들 / 이름표 / 몸통 ── */
  if(zresHit){ const z=ZONES.find(x=>x.id===zresHit.getAttribute("data-zres"));
    if(z){ sel=null; selRail=null; selWpt=null; selZone=z.id;
      drag={kind:"zres",id:z.id,sx:e.clientX,sy:e.clientY,w0:z.w,d0:z.d,s:svgScale()};
      svg.setPointerCapture(e.pointerId); renderProp(); render(); } return; }
  if(zwordHit){ const z=ZONES.find(x=>x.id===zwordHit.getAttribute("data-zword"));
    if(z){ sel=null; selRail=null; selWpt=null; selZone=z.id;
      drag={kind:"zword",id:z.id,sx:e.clientX,sy:e.clientY,u0:z.lu,v0:z.lv,s:svgScale()};
      svg.setPointerCapture(e.pointerId); renderProp(); render(); } return; }
  if(insHit){   /* 세그먼트 중간 ＋ = 꺾기점 삽입 후 바로 드래그 */
    const a=insHit.getAttribute("data-ins").split(":"), rid=a[0], si=+a[1], r=RAILS.find(x=>x.id===rid);
    if(r){ if(!r.pts) r.pts=[]; const path=railPath(r);
      const m=[(path[si][0]+path[si+1][0])/2,(path[si][1]+path[si+1][1])/2], gp=snapPt(m[0],m[1]);
      r.pts.splice(si,0,{u:gp.u,v:gp.v}); selRail=rid; sel=null; selZone=null; selWpt={rail:rid,idx:si};
      const s=svgScale(); drag={kind:"wpt",rail:rid,idx:si,sx:e.clientX,sy:e.clientY,u0:gp.u,v0:gp.v,s};
      svg.setPointerCapture(e.pointerId); renderProp(); render(); } return;
  }
  if(wptHit){   /* 꺾기점 선택 + 드래그 */
    const a=wptHit.getAttribute("data-wpt").split(":"), rid=a[0], i=+a[1], r=RAILS.find(x=>x.id===rid);
    if(r&&r.pts&&r.pts[i]){ selRail=rid; sel=null; selZone=null; selWpt={rail:rid,idx:i};
      const s=svgScale(); drag={kind:"wpt",rail:rid,idx:i,sx:e.clientX,sy:e.clientY,u0:r.pts[i].u,v0:r.pts[i].v,s};
      svg.setPointerCapture(e.pointerId); renderProp(); render(); } return;
  }
  if(lblHit){   /* 라벨(글자) 선택 + 드래그 — 화면 오프셋 */
    const name=lblHit.getAttribute("data-lbl"), o=byName[name];
    if(o&&o.lab){ sel=name; selRail=null; selWpt=null; selZone=null;
      const s=svgScale(); drag={kind:"lbl",name,sx:e.clientX,sy:e.clientY,dx0:o.lab.dx,dy0:o.lab.dy,s};
      svg.setPointerCapture(e.pointerId); renderProp(); render(); } return;
  }
  if(objHit){   /* 오브젝트 선택 + 드래그 */
    const name=objHit.getAttribute("data-name"); const changed=(sel!==name||selRail!==null||selWpt!==null||selZone!==null);
    sel=name; selRail=null; selWpt=null; selZone=null;
    const s=svgScale();
    drag={kind:"obj", name, sx:e.clientX, sy:e.clientY, u0:LAYOUT[name].u, v0:LAYOUT[name].v, s};
    svg.setPointerCapture(e.pointerId); if(changed) renderProp(); render(); return;
  }
  if(railHit){   /* 레일 선택 */
    const id=railHit.getAttribute("data-rail"); const changed=(selRail!==id||sel!==null||selZone!==null);
    selRail=id; sel=null; selWpt=null; selZone=null; if(changed) renderProp(); render(); return;
  }
  if(zoneHit){   /* 구역 바닥 = 맨 마지막 판정 → 노드·레일 클릭을 절대 가로채지 않음 */
    const z=ZONES.find(x=>x.id===zoneHit.getAttribute("data-zone"));
    if(z){ sel=null; selRail=null; selWpt=null; selZone=z.id;
      drag={kind:"zone",id:z.id,sx:e.clientX,sy:e.clientY,u0:z.u,v0:z.v,s:svgScale()};
      svg.setPointerCapture(e.pointerId); renderProp(); render(); }
    return;
  }
  if(sel||selRail||selWpt||selZone){ sel=null; selRail=null; selWpt=null; selZone=null; renderProp(); render(); }   /* 빈 곳 = 해제 */
});
svg.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dxs=(e.clientX-drag.sx)*drag.s, dys=(e.clientY-drag.sy)*drag.s;
  /* 화면 이동 → (du,dv) 역산.  x=(u-v)KX, y=-(u+v)KY */
  let du=(dxs/KX - dys/KY)/2, dv=(-dxs/KX - dys/KY)/2;
  if(drag.kind==="zone"){ const z=ZONES.find(x=>x.id===drag.id);
    if(z){ const g=SNAP>0?SNAP:1;
      const nu=Math.round((drag.u0+du)/g)*g, nv=Math.round((drag.v0+dv)/g)*g;
      z.lu+=nu-z.u; z.lv+=nv-z.v; z.u=nu; z.v=nv; render(); } return; }   /* 이름표도 같이 따라감 */
  if(drag.kind==="zres"){ const z=ZONES.find(x=>x.id===drag.id);
    if(z){ const g=SNAP>0?SNAP:1;
      z.w=Math.max(24,Math.round((drag.w0+du)/g)*g); z.d=Math.max(24,Math.round((drag.d0+dv)/g)*g); render(); } return; }
  if(drag.kind==="zword"){ const z=ZONES.find(x=>x.id===drag.id);
    if(z){ z.lu=Math.round(drag.u0+du); z.lv=Math.round(drag.v0+dv); render(); } return; }
  if(drag.kind==="wpt"){ const r=RAILS.find(x=>x.id===drag.rail);
    if(r&&r.pts&&r.pts[drag.idx]){ const sp=snapPt(drag.u0+du,drag.v0+dv); r.pts[drag.idx]={u:sp.u,v:sp.v}; render(); } return; }
  if(drag.kind==="lbl"){ const o=byName[drag.name]; if(o&&o.lab){
    o.lab.dx=Math.round(drag.dx0+(e.clientX-drag.sx)*drag.s); o.lab.dy=Math.round(drag.dy0+(e.clientY-drag.sy)*drag.s); render(); } return; }
  const n=byName[drag.name];
  const sb=snapBase(n, drag.u0+du, drag.v0+dv);
  /* 스마트 정렬: 다른 오브젝트 중앙선에 근접하면 딱 맞추고 가이드선 표시 */
  const cox=n.hit[0]+n.hit[2]/2, coy=n.hit[1]+n.hit[3]/2;
  let cu=sb.u+cox, cv=sb.v+coy; activeGuides=[];
  allObjs().forEach(m=>{ if(m.name===n.name) return; const mc=center(m);
    if(Math.abs(cu-mc[0])<=GUIDE_EPS){ cu=mc[0]; activeGuides.push(["u",mc[0]]); }
    if(Math.abs(cv-mc[1])<=GUIDE_EPS){ cv=mc[1]; activeGuides.push(["v",mc[1]]); } });
  LAYOUT[drag.name].u=Math.round(cu-cox); LAYOUT[drag.name].v=Math.round(cv-coy);
  render();
});
function endDrag(e){ if(!drag) return; drag=null; activeGuides=[]; render(); }
svg.addEventListener("pointerup",endDrag);
svg.addEventListener("pointercancel",endDrag);

/* 방향키 미세이동 · Delete=선택 레일/추가 상자 삭제 */
window.addEventListener("keydown",e=>{
  const t=e.target.tagName; if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA") return;  /* 입력 중엔 무시 */
  if(e.key==="Delete"||e.key==="Backspace"){
    if(selWpt){ const r=RAILS.find(x=>x.id===selWpt.rail); if(r&&r.pts) r.pts.splice(selWpt.idx,1); selWpt=null; e.preventDefault(); render(); return; }
    if(selRail){ e.preventDefault(); delRail(selRail); return; }
    if(selZone){ e.preventDefault(); delZone(selZone); return; }
    if(sel && byName[sel] && byName[sel].extra){ e.preventDefault(); delObj(sel); return; } }
  if(e.key==="Escape" && connectMode){ setConnect(false); return; }
  if(!sel && !selZone) return;
  const g=SNAP>0?SNAP:1; const step=(e.shiftKey?5:1)*g;
  let du=0,dv=0;
  if(e.key==="ArrowLeft") du=-step; else if(e.key==="ArrowRight") du=step;
  else if(e.key==="ArrowUp") dv=-step; else if(e.key==="ArrowDown") dv=step; else return;
  e.preventDefault();
  if(selZone){ const z=ZONES.find(x=>x.id===selZone);
    if(z){ z.u+=du; z.v+=dv; z.lu+=du; z.lv+=dv; } }
  else { LAYOUT[sel].u+=du; LAYOUT[sel].v+=dv; }
  render();
});

/* ── 패널 ── */
const outEl=document.getElementById("out");
const selName=document.getElementById("selName"), selCoord=document.getElementById("selCoord");
function syncOut(){
  if(selZone){ const z=ZONES.find(x=>x.id===selZone);
    selName.textContent = z?("구역 "+z.name+"  ("+z.id+")"):"— 없음 —";
    selCoord.textContent = z?("u="+z.u+" v="+z.v+"  w="+z.w+" d="+z.d):""; }
  else if(selRail){ const r=RAILS.find(x=>x.id===selRail);
    selName.textContent = r?("레일 "+r.a+" → "+r.b+"  ("+r.id+")"):"— 없음 —";
    selCoord.textContent = r?("색: "+r.color+((r.lanes||1)>1?" · 줄수: "+r.lanes:"")+(r.cross?" · 교차":"")):""; }
  else if(sel && byName[sel]){ const o=byName[sel]; const lbl=o.extra?o.props.label:o.label;
    selName.textContent=lbl+"  ("+sel+")"; selCoord.textContent="u="+LAYOUT[sel].u+"  v="+LAYOUT[sel].v; }
  else { selName.textContent="— 없음 —"; selCoord.textContent=""; }
  const pos=allObjs().map(n=>{ const L=LAYOUT[n.name];
    const moved=(!n.extra && (L.u!==INIT[n.name].u||L.v!==INIT[n.name].v));
    return "  "+n.name+": {u:"+L.u+", v:"+L.v+"},"+(moved?"   // ← 이동됨":(n.extra?"   // ← 추가됨":"")); });
  let out="LAYOUT = {\n"+pos.join("\n")+"\n}";
  if(EXTRA.length){ const ex=EXTRA.map(o=>{ const L=LAYOUT[o.name], p=o.props;
    return "  {id:'"+o.name+"', u:"+L.u+", v:"+L.v+", w:"+p.w+", d:"+p.d+", h:"+p.h+", color:'"+p.color+"', label:'"+String(p.label).replace(/'/g,"\\'")+"'"+(p.cap?", cap:'"+String(p.cap).replace(/'/g,"\\'")+"'":"")+"},"; });
    out+="\n\nEXTRA = [\n"+ex.join("\n")+"\n]"; }
  out+="\n\nRAILS = [\n"+RAILS.map(r=>{ const pts=(r.pts&&r.pts.length)?", pts:["+r.pts.map(p=>"{u:"+p.u+",v:"+p.v+"}").join(",")+"]":"";
    const ln=(r.lanes>1)?", lanes:"+r.lanes:"";
    const cx=(r.cross&&r.lanes>1)?", cross:true":"";
    return "  {from:'"+r.a+"', to:'"+r.b+"', color:'"+r.color+"'"+ln+cx+pts+"},"; }).join("\n")+"\n]";
  out+="\n\nLABELS = [\n"+allObjs().filter(n=>n.lab).map(n=>{
    const t=n.lab.lines.map(l=>l[0]);
    const chg=(!n.extra && INIT_TXT[n.name] && t.join("")!==INIT_TXT[n.name].join(""));
    const tx=chg?", texts:["+t.map(s=>"'"+String(s).replace(/'/g,"\\'")+"'").join(", ")+"]":"";
    return "  {name:'"+n.name+"', dx:"+Math.round(n.lab.dx)+", dy:"+Math.round(n.lab.dy)+tx+"},"; }).join("\n")+"\n]";
  out+="\n\nZONES = [\n"+ZONES.map(z=>"  {u:"+z.u+", v:"+z.v+", w:"+z.w+", d:"+z.d+", color:'"+z.color+
    "', name:'"+String(z.name).replace(/'/g,"\\'")+"', lu:"+z.lu+", lv:"+z.lv+
    ", ws:"+(+(+z.ws).toFixed(1))+", wo:"+(+(+z.wo).toFixed(2))+"},").join("\n")+"\n]";
  outEl.value=out;
}
/* 선택된 EXTRA 오브젝트의 속성 편집기(선택 변경 때만 재생성 → 입력 포커스 유지) */
function renderProp(){
  const box=document.getElementById("propBox"); box.innerHTML="";
  function fld(t,inp){ const w=document.createElement("label"); w.className="fld";
    const s=document.createElement("span"); s.textContent=t; w.appendChild(s); w.appendChild(inp); return w; }
  function selOf(cur,keys,on){ const s=document.createElement("select");
    keys.forEach(k=>{ const op=document.createElement("option"); op.value=k; op.textContent=k; if(k===cur)op.selected=true; s.appendChild(op); });
    s.onchange=()=>on(s.value); return s; }
  /* 구역 바닥 편집 */
  if(selZone){ const z=ZONES.find(x=>x.id===selZone); if(!z) return;
    const tinZ=k=>{ const i=document.createElement("input"); i.type="text"; i.value=z[k]||"";
      i.oninput=()=>{ z[k]=i.value; render(); }; return i; };
    const ninZ=k=>{ const i=document.createElement("input"); i.type="number"; i.value=z[k];
      i.oninput=()=>{ z[k]=Math.max(24,parseFloat(i.value)||24); render(); }; return i; };
    const posZ=k=>{ const i=document.createElement("input"); i.type="number"; i.value=z[k];
      i.oninput=()=>{ const nv=Math.round(parseFloat(i.value)||0);
        if(k==="u"){ z.lu+=nv-z.u; } else { z.lv+=nv-z.v; }   /* 이름표도 같이 */
        z[k]=nv; render(); }; return i; };
    /* 바닥 글자: 문구는 name, 자리는 끌어서(lu,lv), 크기·진하기는 여기서 */
    const numZ=(k,mn,mx,st)=>{ const i=document.createElement("input"); i.type="number";
      i.step=st; i.min=mn; i.max=mx; i.value=z[k];
      i.oninput=()=>{ const nv=parseFloat(i.value);
        if(!isNaN(nv)){ z[k]=Math.min(mx,Math.max(mn,nv)); render(); } }; return i; };
    box.appendChild(fld("이름",tinZ("name")));
    const rt=document.createElement("div"); rt.className="row";
    rt.appendChild(fld("크기",numZ("ws",8,80,1))); rt.appendChild(fld("진하기",numZ("wo",0,1,.02)));
    box.appendChild(rt);
    const rp=document.createElement("div"); rp.className="row";
    rp.appendChild(fld("u",posZ("u"))); rp.appendChild(fld("v",posZ("v")));
    box.appendChild(rp);
    const rw=document.createElement("div"); rw.className="row";
    rw.appendChild(fld("폭",ninZ("w"))); rw.appendChild(fld("깊이",ninZ("d")));
    box.appendChild(rw);
    box.appendChild(fld("색", selOf(z.color,["net","game","store","gray","outside"],v=>{z.color=v; render();})));
    const dz=document.createElement("button"); dz.className="btn"; dz.textContent="🗑 구역 삭제"; dz.style.marginTop="6px";
    dz.onclick=()=>delZone(z.id); box.appendChild(dz);
    const hint=document.createElement("div"); hint.className="hint"; hint.style.marginTop="6px";
    hint.textContent="모서리 주황 사각형=구역 크기. 바닥에 눕힌 이름은 글자를 직접 끌어서 자리를 잡습니다(점선이 잡히는 범위). 이름을 지우면 글자가 사라집니다.";
    box.appendChild(hint); return; }
  /* 레일 편집 */
  if(selRail){ const r=RAILS.find(x=>x.id===selRail); if(!r) return;
    box.appendChild(fld("색", selOf(r.color,["recv","send","store","net"],v=>{r.color=v; render();})));
    box.appendChild(fld("줄수", selOf(String(r.lanes||1),["1","2","3","4"],v=>{r.lanes=+v; render();})));
    /* 교차 = 꺾이는 곳에서 바깥 두 줄이 자리를 맞바꿔 X 로 겹친다(줄 2개 이상일 때만 의미 있음) */
    box.appendChild(fld("교차", selOf(r.cross?"켬":"끔",["끔","켬"],v=>{r.cross=(v==="켬"); render();})));
    box.appendChild(fld("시작", selOf(r.a, allObjs().map(o=>o.name), v=>{r.a=v; render();})));
    box.appendChild(fld("끝", selOf(r.b, allObjs().map(o=>o.name), v=>{r.b=v; render();})));
    const del=document.createElement("button"); del.className="btn"; del.textContent="🗑 레일 삭제"; del.style.marginTop="6px";
    del.onclick=()=>delRail(r.id); box.appendChild(del); return; }
  /* 오브젝트 편집 */
  const o=sel?byName[sel]:null; if(!o) return;
  if(!o.extra){
    if(o.lab&&o.lab.lines.length){
      const h=document.createElement("div"); h.className="hint";
      h.textContent="기본 오브젝트 — 위치 이동과 글자 수정만 됩니다(모양 고정)."; box.appendChild(h);
      o.lab.lines.forEach((ln,i)=>{ const inp=document.createElement("input"); inp.type="text"; inp.value=ln[0];
        inp.oninput=()=>{ ln[0]=inp.value; render(); };
        box.appendChild(fld("글자 "+(i+1),inp)); });
    } else box.innerHTML='<div class="hint">기본 오브젝트 — 위치만 이동됩니다(모양 고정).</div>';
    return; }
  const p=o.props;
  function tin(key){ const i=document.createElement("input"); i.type="text"; i.value=p[key]||"";
    i.oninput=()=>{ p[key]=i.value; if(o.lab) o.lab.lines=labLinesFromProps(p); render(); }; return i; }
  function nin(key){ const i=document.createElement("input"); i.type="number"; i.value=p[key];
    i.oninput=()=>{ p[key]=parseFloat(i.value)||0; syncExtraHit(o); render(); }; return i; }
  box.appendChild(fld("라벨",tin("label")));
  box.appendChild(fld("캡션",tin("cap")));
  const row=document.createElement("div"); row.className="row";
  row.appendChild(fld("폭",nin("w"))); row.appendChild(fld("깊이",nin("d"))); row.appendChild(fld("높이",nin("h")));
  box.appendChild(row);
  box.appendChild(fld("색", selOf(p.color,["slate","blue","green","orange","crowd"],v=>{p.color=v; render();})));
  const del=document.createElement("button"); del.className="btn"; del.textContent="🗑 삭제"; del.style.marginTop="6px";
  del.onclick=()=>delObj(o.name); box.appendChild(del);
}

  NODES.forEach(n=>{ LAYOUT[n.name].u=INIT[n.name].u; LAYOUT[n.name].v=INIT[n.name].v; });
  NODES.forEach(n=>{ if(n.lab&&INIT_TXT[n.name]) n.lab.lines.forEach((ln,i)=>{ ln[0]=INIT_TXT[n.name][i]; }); });

/* 레일 잇기 모드 토글 */
const addRailBtn=document.getElementById("addRail");
function setConnect(on){ connectMode=on; if(!on) connectFrom=null;
  addRailBtn.classList.toggle("pri",on);
  addRailBtn.textContent=on?"오브젝트 2개 클릭…(취소=빈곳/Esc)":"＋ 레일 잇기"; render(); }
addRailBtn.addEventListener("click",()=>setConnect(!connectMode));
function flashOut(msgEl, text){ if(msgEl){ msgEl.textContent=text; msgEl.style.color="#7fe0aa"; }
  outEl.classList.add("flash"); setTimeout(()=>outEl.classList.remove("flash"),700);
  if(msgEl) setTimeout(()=>{ msgEl.textContent=""; msgEl.style.color=""; },2600); }
function copyExport(msgEl){ syncOut(); outEl.focus(); outEl.select();
  const ok=()=>flashOut(msgEl,"✔ 복사됨 — 저(클로드)에게 붙여넣으세요");
  const no=()=>flashOut(msgEl,"아래 텍스트를 Ctrl+C 로 복사하세요");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(outEl.value).then(ok).catch(no); }
  else { try{ document.execCommand("copy"); ok(); }catch(e){ no(); } } }
document.getElementById("export").addEventListener("click",()=>copyExport(document.getElementById("exportMsg")));
document.getElementById("copy").addEventListener("click",()=>copyExport(document.getElementById("copyMsg")));

/* ── 저장/불러오기: 전체 상태(위치·상자·레일·꺾기·라벨)를 JSON 파일로 ── */
function download(name,text){ const b=new Blob([text],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
function serialize(){ return { v:1,
  positions: NODES.map(n=>({name:n.name,u:LAYOUT[n.name].u,v:LAYOUT[n.name].v})),
  labels: NODES.filter(n=>n.lab).map(n=>({name:n.name,dx:Math.round(n.lab.dx),dy:Math.round(n.lab.dy),texts:n.lab.lines.map(l=>l[0])})),
  extras: EXTRA.map(o=>({props:Object.assign({},o.props), u:LAYOUT[o.name].u, v:LAYOUT[o.name].v,
    lab:{dx:Math.round(o.lab.dx),dy:Math.round(o.lab.dy)}})),
  rails: RAILS.map(r=>({a:r.a,b:r.b,color:r.color,lanes:r.lanes||1,cross:!!r.cross,pts:(r.pts||[]).map(p=>({u:p.u,v:p.v}))})),
  zones: ZONES.map(z=>({u:z.u,v:z.v,w:z.w,d:z.d,color:z.color,name:z.name,lu:z.lu,lv:z.lv,ws:z.ws,wo:z.wo})) }; }
function applyState(s){
  EXTRA.slice().forEach(o=>{ delete byName[o.name]; delete LAYOUT[o.name]; }); EXTRA.length=0; extraSeq=0;
  (s.positions||[]).forEach(p=>{ if(byName[p.name]&&!byName[p.name].extra) LAYOUT[p.name]={u:p.u,v:p.v}; });
  (s.labels||[]).forEach(l=>{ const o=byName[l.name]; if(o&&o.lab){ o.lab.dx=l.dx||0; o.lab.dy=l.dy||0;
    if(l.texts) l.texts.forEach((s2,i)=>{ if(o.lab.lines[i]) o.lab.lines[i][0]=s2; }); } });
  (s.extras||[]).forEach(e=>{ const o=addExtra(Object.assign({},e.props||{})); LAYOUT[o.name]={u:Math.round(e.u||0),v:Math.round(e.v||0)};
    if(e.lab){ o.lab.dx=e.lab.dx||0; o.lab.dy=e.lab.dy||0; } });
  RAILS.length=0; railSeq=0; (s.rails||[]).forEach(r=>addRail(r.a,r.b,r.color,r.pts,r.lanes,r.cross));
  /* zones 키가 없는 옛 저장본은 구역 없음으로 복원된다(저장 시점 그대로) */
  ZONES.length=0; zoneSeq=0; (s.zones||[]).forEach(z=>addZone(z));
  sel=null; selRail=null; selWpt=null; selZone=null; renderProp(); render(); }
document.getElementById("saveFile").addEventListener("click",()=>{
  download("mmo-layout.json", JSON.stringify(serialize(),null,1));
  flashOut(document.getElementById("exportMsg"),"💾 mmo-layout.json 저장됨"); });
document.getElementById("loadFile").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ applyState(JSON.parse(rd.result)); flashOut(document.getElementById("exportMsg"),"📂 불러옴 ✔"); }
    catch(err){ flashOut(document.getElementById("exportMsg"),"불러오기 실패 — 형식 오류"); } };
  rd.readAsText(f); e.target.value=""; });

/* URL로 초기 배치/선택 주입(공유·데모용): ?l={"game":{"u":..,"v":..},...}&sel=game */
(function(){ const q=new URLSearchParams(location.search);
  const lp=q.get("l"); if(lp){ try{ const o=JSON.parse(lp);
    for(const k in o){ if(LAYOUT[k]){ if(o[k].u!=null)LAYOUT[k].u=o[k].u; if(o[k].v!=null)LAYOUT[k].v=o[k].v; } } }catch(e){} }
  const ad=+(q.get("add")||0); for(let i=0;i<ad;i++) addExtra({u:100+i*30,v:90});
  const sp=q.get("sel"); if(sp&&byName[sp]) sel=sp;
  const sr=q.get("selrail"); if(sr&&RAILS.find(r=>r.id===sr)){ selRail=sr;
    if(q.get("bend")){ const r=RAILS.find(x=>x.id===sr); r.pts=[{u:300,v:-20},{u:240,v:-40}]; } }
  if(q.get("snapall")) allObjs().forEach(n=>{ LAYOUT[n.name]=snapBase(n,LAYOUT[n.name].u,LAYOUT[n.name].v); }); })();

renderProp();
render();
})();
</script>
</body>
