<body>

<div class="wrap">

<!-- 왼쪽 기둥(2026-11-18) — 넓은 화면(1280 이상)에서 상위 탭 · 하위 탭 · 소개 판 목록 세 겹을 한 줄기로 보인다.
     안은 비어 있고 tabs.js 가 아래 원래 단추들에서 이름을 읽어 채운다 — 이름을 두 곳에 적지 않는다.
     좁은 화면에서는 숨고 원래 두 줄(.tabrow · .subtabs) + 목록이 그대로 나온다(common.css). -->
<nav class="side" id="side" aria-label="섹션"></nav>

<!-- 본문 감싸개 — 넓은 화면에서 기둥 옆 칸이 된다. 판을 숨기지는 않는다(판 여닫기는 각 판의 hidden 그대로) -->
<div class="main">

<div class="tabrow">
    <nav class="tabs" role="tablist" aria-label="섹션">
      <button class="tab act" data-tab="mmo" role="tab" aria-selected="true"><b>MMORPG</b><span>2D 탑뷰 · 존 방식</span></button>
      <button class="tab" data-tab="mo" role="tab" aria-selected="false"><b>NOX 서버</b><span>MO · 상용 클라 접속</span></button>
      <button class="tab" data-tab="shooter" role="tab" aria-selected="false"><b>슈팅 서버</b><span>MO · 언리얼 Lyra 클라</span></button>
      <button class="tab" data-tab="misc" role="tab" aria-selected="false"><b>링크 모음</b><span>GitHub · Notion</span></button>
    </nav>
    <!-- 스택 한 줄(C++17 · Windows IOCP)이 여기 있었다. 뺀 까닭은 줄이 안 맞아서다 —
         이 줄은 페이지 폭(.wrap)을 쓰고 바로 아래 소탭 줄의 문은 클라 판 폭(1700)에 묶여 있어,
         붙어 있는 두 줄의 오른쪽 끝이 80px 어긋났다(1920 창). 셋을 한 선에 세울 방법이 없어
         가장 덜 잃는 쪽을 뺐다. 스택은 GitHub 저장소와 노션 설계 문서가 첫 줄에서 말한다. -->
  </div>

  <!-- MMORPG 하위 탭 줄. 상위 탭이 MMORPG 일 때만 보인다.
       짜임은 위 .tabrow 와 같다 — 왼쪽은 이동(탭), 오른쪽 끝은 그 줄의 부가물.
       위 줄의 부가물이 스택 메타라면 이 줄의 것은 1-1 화면의 구역 필터다.
       그래서 줄(.subtabs)과 탭 목록(.subnav)을 갈라 둔다 — 바닥선은 줄이 갖고,
       role="tablist" 는 탭만 담은 안쪽이 갖는다(탭 목록 안에 버튼 그룹을 섞으면 안 된다). -->
  <div class="subtabs" id="subtabs">
    <nav class="subnav" role="tablist" aria-label="MMORPG 하위 섹션">
      <!-- 소개(11-17) — 게임 소개 + 옛 1-3 컨텐츠를 합친 첫 화면(panel-intro.html). 녹스 · 슈팅 탭도 같은 셋이다 -->
      <button class="subtab act" data-sub="intro" role="tab" aria-selected="true">게임 소개</button>
      <button class="subtab" data-sub="build" role="tab" aria-selected="false">전체 구조</button>
      <button class="subtab" data-sub="bneck" role="tab" aria-selected="false">병목 개선</button>
      <!-- 옛 1-3 핵심 최적화는 1-2 병목 개선 아래로 내렸다(2026-10-27) — 원리 그림 다섯이 1-2 의
           실험 2·6·8·9·15 와 짝이라 한 화면에서 이어 읽히게. 옛 주소 #optimization-* 는 1-2 로 연다(tabs.js). -->
      <!-- 옛 상위 탭 '클라이언트'(2-1 실행 화면 · 2-2 안전성 검증 · 2-3 부하 검증)는 없앴다.
           2-2·2-3 은 뺐다(자세한 건 노션 쪽에 있다). 실행 화면 녹화는 '5,000명을 버틴다' — 병목 개선의 결과라
           1-2 맨 아래 결과 판으로 둔다(2026-10-27 · 거쳐 온 자리는 client.css #p-crender 주석). -->
    </nav>
    <!-- 구역 강조 — 누르면 그 구역만 남고 나머지는 죽는다. 같은 버튼을 다시 누르면 전체로 복귀.
         data-z 값은 ZONES[].color(=ZPAL 키)와 같은 문자열이라 스크립트가 그대로 씬에 얹는다.
         1-1 에서만 쓰는 조작이라 1-2 로 가면 숨긴다(tabs.js). -->
    <div class="zonebar" id="zonebar" role="group" aria-label="구역 강조">
      <button type="button" class="zb all act" data-z="" aria-pressed="true">전체</button>
      <button type="button" class="zb" data-z="outside" aria-pressed="false"><i></i>클라</button>
      <button type="button" class="zb" data-z="net" aria-pressed="false"><i></i>네트워크</button>
      <button type="button" class="zb" data-z="game" aria-pressed="false"><i></i>게임</button>
      <button type="button" class="zb" data-z="store" aria-pressed="false"><i></i>데이터베이스</button>
    </div>
    <!-- 이 줄 오른쪽 끝에 있던 나가는 문(#builddoor)은 2026-10-27 에 씬 왼쪽 아래 '다시 재생' 옆으로
         내렸다(panel-build.html .stage-ctl) — 줄 끝 글자는 탭 줄의 일부로 보여 찾기 어려웠다. -->
    <!-- 맨 위로(2026-10-28) — 1-2 에서 이 줄이 화면 위에 붙어 있을 때만 보인다(common.css .subtop · tabs.js).
         파란 호 = 페이지를 얼마나 내려왔는지. 둘레 106.8 = 2π×17 — tabs.js 가 같은 값으로 호를 채운다. -->
    <button type="button" class="subtop" aria-label="맨 위로"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" class="subtop-bg"/>
      <circle cx="20" cy="20" r="17" class="subtop-arc" stroke-dasharray="106.8" stroke-dashoffset="106.8" transform="rotate(-90 20 20)"/>
      <path d="M20 26V14M14.5 19.5 20 14l5.5 5.5" class="subtop-ar"/></svg></button>
  </div>
  <!-- 아래로(2026-10-28) — 1-2 첫 화면이 지도·카드로 꽉 차서 아래에 판이 더 있다는 게 안 보였다.
       화면 아래 가운데에 떠 있다가 맨 밑 결과 판(#p-crender)이 끝까지 보이면 사라진다(common.css .subdown · tabs.js).
       .subtabs 안에 두지 않는 까닭 — 그 줄의 clip-path 가 fixed 자식까지 잘라 버린다. -->
  <button type="button" class="subdown" aria-label="아래 판으로"><svg viewBox="0 0 40 40" width="56" height="56" aria-hidden="true">
    <circle cx="20" cy="20" r="17" class="subdown-bg"/>
    <path d="M20 13v13M14.5 20.5 20 26l5.5-5.5" class="subtop-ar"/></svg></button>

       한때 여기 스택 노트와 천장 수치가 같이 있었는데 둘 다 뺐다 — 스택은 탭줄 오른쪽 메타

       그림은 노션 커버·GitHub 화면을 그대로 찍은 것이라 그쪽이 바뀌면 낡는다 — 다시 찍어 갈아끼우면 된다.
       찍는 법(2026-11-24) — 헤드리스 크롬 1600×900 · 어두운 테마(prefers-color-scheme:dark) → 폭 1280 으로 줄여 저장.
       노션은 맨 위 검은 머리띠(44px)를 잘라 낸다(그래서 iocp 만 1280×685). 폭 1280 = 카드 그림 칸이 가장 넓을 때(787px, 1920×940)

        전에는 바깥 판 하나에 줄 넷을 담았는데, 카드 넷으로 바뀌며 바깥 판은 자리만 잡고 겉모양이 없다(.lk-box).
        ※ 한때 여기 머리줄('나가는 문 — 소스 · 설계 문서 · 프로필')이 있었다. 1-2 의 '실험 N건 …' 을

          제목 셋이 이미 그 말을 하고 있었다. 같은 말을 두 번 해서 뺐다. -->
