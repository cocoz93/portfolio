       위 줄의 부가물이 스택 메타라면 이 줄의 것은 1-1 화면의 구역 필터다.
       그래서 줄(.subtabs)과 탭 목록(.subnav)을 갈라 둔다 — 바닥선은 줄이 갖고,
       role="tablist" 는 탭만 담은 안쪽이 갖는다(탭 목록 안에 버튼 그룹을 섞으면 안 된다). -->

         data-z 값은 ZONES[].color(=ZPAL 키)와 같은 문자열이라 스크립트가 그대로 씬에 얹는다.
         1-1 에서만 쓰는 조작이라 1-2 로 가면 숨긴다(tabs.js). -->
    <div class="zonebar" id="zonebar" role="group" aria-label="구역 강조">
      <button type="button" class="zb all act" data-z="" aria-pressed="true">전체</button>
      <button type="button" class="zb" data-z="outside" aria-pressed="false"><i></i>클라</button>

          시절의 이름이다. 지금 2-2 에 부하는 없는데 이름만 남아 옆칸 '부하 검증' 과 두 글자 순서만
          다른 라벨이 됐다 — 나란히 놓고 보면 어느 쪽이 무엇인지 못 고른다. '안전성 검증' 으로 바꾼다. -->
