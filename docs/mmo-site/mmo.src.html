  <!-- MMO 서버 하위 탭 줄. 상위 탭이 MMO 서버일 때만 보인다.
       짜임은 위 .tabrow 와 같다 — 왼쪽은 이동(탭), 오른쪽 끝은 그 줄의 부가물.
       위 줄의 부가물이 스택 메타라면 이 줄의 것은 1-1 화면의 구역 필터다.
       그래서 줄(.subtabs)과 탭 목록(.subnav)을 갈라 둔다 — 바닥선은 줄이 갖고,
       role="tablist" 는 탭만 담은 안쪽이 갖는다(탭 목록 안에 버튼 그룹을 섞으면 안 된다). -->

    </nav>
    <!-- 구역 강조 — 누르면 그 구역만 남고 나머지는 죽는다. 같은 버튼을 다시 누르면 전체로 복귀.
         data-z 값은 ZONES[].color(=ZPAL 키)와 같은 문자열이라 스크립트가 그대로 씬에 얹는다.
         1-1 에서만 쓰는 조작이라 1-2 로 가면 숨긴다(tabs.js). -->
    <div class="zonebar" id="zonebar" role="group" aria-label="구역 강조">
      <button type="button" class="zb all act" data-z="" aria-pressed="true">전체</button>
      <button type="button" class="zb" data-z="outside" aria-pressed="false"><i></i>클라</button>
      <button type="button" class="zb" data-z="net" aria-pressed="false"><i></i>네트워크</button>
      <button type="button" class="zb" data-z="game" aria-pressed="false"><i></i>게임</button>
      <button type="button" class="zb" data-z="store" aria-pressed="false"><i></i>데이터베이스</button>
    </div>
  </div>
  <!-- 클라이언트 탭의 하위 줄. MMO 쪽과 같은 생김새를 쓰되 상태는 따로 갖는다(csub) -->
  <!-- 세 단계는 나란한 선택지가 아니라 검증 순서다: 무엇을 만들었나 → 믿을 수 있나 → 어디까지 버티나.
       ②③ 이 곧 노션 허브의 3단 사다리(남의 자 → 내 자 → 컨텐츠)에서 Step1·2 와 Step3 이다.
       ④ 는 3회차에 ③ 으로 흡수하고 없앤다 — 그 내용은 부하 수치를 믿을 수 있는 근거라 ③ 자리다.
       ※ 2-2 는 한때 '검증 · 부하' 였다. ④ 를 ③ 으로 흡수하기 전, 2-2 가 안전성과 부하를 같이 이던
          시절의 이름이다. 지금 2-2 에 부하는 없는데 이름만 남아 옆칸 '부하 검증' 과 두 글자 순서만
          다른 라벨이 됐다 — 나란히 놓고 보면 어느 쪽이 무엇인지 못 고른다. '안전성 검증' 으로 바꾼다. -->
  <div class="subtabs" id="subtabs2" role="tablist" aria-label="클라이언트 하위 섹션" hidden>
