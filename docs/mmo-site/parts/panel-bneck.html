<section class="panel" id="p-bneck" role="tabpanel" hidden>
    <!-- 판 세 장을 겹친다. 아래부터 설계 모습 → 청사진(대각선 마스크 뒤) → 핀.
         전환 애니는 이 요소들의 마스크/transform/opacity 만 건드린다(SVG 안은 그린 뒤 정지).
         .bn-shift = 지도·카드와 캡션을 한 덩어리로 묶는 껍데기. -->
    <div class="bn-shift">
      <div class="bn-stage">
        <!-- viewBox 805 = 그림이 실제로 차지하는 칸 그대로다(내용 bbox x 321~1099 를 재서 잡았다 — 클라 판을 좁히기 전에는 256~1099·900 이었다).
             한때는 여기를 1200·1420 으로 늘려 오른쪽에 빈 칸을 만들고 그 자리에 패널을 얹었는데,
             그러면 패널이 지도 아래로 내려가는 좁은 화면에서 그 빈 칸이 갈 곳 없이 남는다
             (그림이 판의 62% 만 쓰고 오른쪽 38% 가 빈 채로 그려진다).
             그래서 자리 나누기는 CSS 폭(.bn-tilt 63% / .bncard 35%)이 맡고, viewBox 는 그림만 담는다.
             ※ 요각 YAW=−12 로 아이소 그림이 오른쪽·아래로 밀려서 시작점을 277,172 → 329,190 으로 옮겼다.
               평면 그림(FPJ)은 각도의 영향을 안 받으므로, 창을 옮긴 만큼 FPJ 의 원점도 같이 옮겨야
               평소 보이는 평면도가 제자리에 남는다(cx +52 · cy +18). 둘은 항상 같이 움직인다.
             ※ 329,835 → 359,805 (2026-07-31). 왼쪽에 빈 칸이 44개 남아 있었다(내용은 373부터인데
               창은 329부터 — 실측). 창만 좁히는 것이라 그림은 제자리에 그대로 있고 배율만 오른다.
               44 를 다 걷지 않고 30 만 걷은 이유: 다 걷으면 지도 왼쪽 끝이 헤더 'MMO 서버' 글자보다
               더 왼쪽으로 튀어나온다. 30 이면 둘이 47px 로 맞는다.
               FPJ 원점은 건드리지 않는다 — 위 YAW 때와 달리 여기는 그림을 옮긴 게 아니라 창만 좁혔다.
               ※ scene.js 의 VX·VW 를 같이 고쳐야 한다. 설계 → 병목 전환이 두 그림을 겹칠 때 쓴다. -->
        <div class="bn-cam"><div class="bn-tilt">
          <svg id="bnsolid" viewBox="359 190 805 500" aria-hidden="true"></svg>
          <div class="bn-reveal">
            <svg id="bnscene" viewBox="359 190 805 500" role="img"
                 aria-label="병목 위치 3곳을 핀으로 표시한 서버 구조 평면도"></svg>
          </div>
          <!-- 핀은 읽는 표시다 — 누르는 것이 아니다(클릭·초점 이동 없음). 자리 이름과 판정 수는
               SVG 글자로 그대로 있으므로 스크린리더도 읽는다.
               ※ 배지 안은 비어 있는 채로 꽂힌다 — 번호는 이제 자리가 아니라 실험이 갖는다.
                 오른쪽 카드를 고르면 그 자리 핀에만 그 카드 번호가 뜬다(bneck.js). -->
          <svg id="bnpins" viewBox="359 190 805 500" role="group" aria-label="병목 지점 핀 6개"></svg>
        </div></div>
        <!-- 오른쪽 칸 = 실험 12건(고르는 곳) + 계기판(고른 것의 값).
             한때 이 앞에 '병목 지점' 세로 레일이 한 칸 더 있었다. 자리를 먼저 고르면 그 자리의
             실험 목록이 카드에 뜨는 2단이었는데, 실험이 열둘뿐인데도 고르기 전에 자리부터 골라야
             했고 병목이 어느 순서로 옮겨갔는지는 어느 화면에도 안 나왔다. 레일을 걷어내고 열둘을
             한 판에 펴면 둘이 같이 풀린다 — 한 번에 고르고, 카드 번호가 곧 그 순서다.
             닫기 버튼은 없다. 닫으면 화면에서 실험이 통째로 사라진다. -->
        <div class="bncard" id="bncard" role="region" aria-label="실험 12건과 계기판" aria-live="polite" hidden>
          <!-- 사다리(200 → 5,200)는 한때 카드 열두 장에 숫자로 박혀 있었다. 그 값은 아래 계기판
               첫 칸이 이미 말하고 있어서, 열두 벌을 세워 둘 이유가 없었다. 여기 한마디로 올리고
               카드에는 고리만 남긴다 — 이 줄이 고리의 눈금을 읽는 말이기도 하다. -->
          <div class="bx-lb">실험 12건 · 동접 200 → 5,200 으로 병목이 옮겨간 순서</div>
          <!-- 카드 열두 장은 bneck.js 가 window.__EXPS 에서 짓는다 — 노션 실측 보고서와 1:1 -->
          <div id="bnc-b"></div>
          <!-- 계기판 네 칸은 '고른 실험의 끄고 → 켜고' 다(paintDash). 한때 화면 맨 위 머리띠였는데,
               그러면 무엇의 값인지 모르는 채로 숫자를 먼저 읽게 된다. 카드 바로 아래로 내려
               고른다 → 그 값 순서를 맞춘다. -->
          <!-- 오른쪽 팬아웃은 통제 지표다 — 실험이 바꾼 값이 아니라 '어떤 부하에서 쟀나' 쪽이라
               칸이 아니라 이 줄에 선다(bneck.js paintFan). -->
          <div class="bx-lb sp">고른 실험 — 끄고 → 켜고<span id="bx-fan"></span></div>
          <div class="bx"><div class="bx-dash" id="bx-dash"></div></div>
          <!-- 노션 원문으로 나가는 문. 카드마다 달려 있던 ↗ 열두 개를 여기 한 짝으로 모은 것이라
               주소는 고른 카드에 따라 bneck.js 가 갈아 끼운다. 자리가 판 맨 아래인 것은
               2-2·2-3 과 같다 — 고르기 → 값 읽기 → 더 읽기 순서라 나가는 문은 끝에 있어야 한다. -->
          <a class="bn-more" id="bn-more" target="_blank" rel="noopener">고른 실험의 실측 보고서 <em>노션 ↗</em></a>
        </div>
      </div>
      <!-- 지도 아래 설명 한 줄(.bn-cap)은 걷어냈다 — 그림이 스스로 말하는 것을 글로 한 번 더 말하고
           있었다(붉은 핀이 병목 자리라는 것 · 고르면 그 자리가 켜진다는 것). 부품이 통째로 물들면서
           특히 뒷문장은 화면보다 덜 말하는 설명이 됐다. 스타일 .bn-cap 도 같이 뺐다. -->
    </div>
  </section>
