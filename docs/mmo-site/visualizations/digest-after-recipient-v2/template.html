<style>
/*STYLES*/
#digest-after-recipient-v2 {--pcb-target:#df6572;--pcb-done:#657282}
#digest-after-recipient-v2 .digest-board {display:block;width:100%;height:auto;background:var(--pcb-bg)}
#digest-after-recipient-v2 .digest-board text {font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;font-weight:500}
#digest-after-recipient-v2 .digest-board .sector-mono {font-family:PCB-Mono,"Malgun Gothic",monospace;font-variant-numeric:tabular-nums}
#digest-after-recipient-v2 [data-status] {min-height:2em}
</style>
<div id="digest-after-recipient-v2" aria-label="4번 그림 변경 후 · 수신자 위의 보낼 Msg와 완료 시 회색 전환">
  <svg class="digest-board" xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-labelledby="digest-after-title digest-after-desc">
    <title id="digest-after-title">변경 후 · 각 수신 섹터의 유효범위에서 Digest 구성</title>
    <desc id="digest-after-desc">마법사 A가 3×3 섹터 안에서 왼쪽 중앙 칸에서 가운데 중앙 칸으로 이동합니다. A 위에는 Msg를 그리지 않습니다. 맨 위 수신자 S1, S2, S3 위에 각각 받아야 할 Msg 수를 표시합니다. 이 표시는 수신자별 보낼 항목의 미리보기이며, 실제 서버의 원본 보관 위치를 뜻하지 않습니다. S1은 Msg 2, 1, 4, S2는 Msg 2, 1, 4, 3, S3은 Msg 1, 4, 3을 받는 예시입니다. 수신자를 하나씩 선택해 해당 유효범위의 기존 Msg 헤더와 데이터를 임시버퍼 Digest로 연접한 뒤 그 주민 SendQ에 한 번 적재합니다. 각 적재가 완료된 뒤 해당 수신자 칸과 Msg 표시가 650밀리초에 걸쳐 빨간색 및 파란색에서 회색으로 전환합니다. 완료한 S1은 다음 S2를 처리할 때도 회색 상태를 유지합니다. 원본 Msg는 다른 수신 섹터를 처리하는 동안 유지하고 재사용 임시버퍼만 비워 다시 구성합니다. 같은 수신 섹터의 여러 주민이 있다면 그 섹터용 Digest 한 번 구성 후 각 주민에게 한 번씩 적재합니다. 새로운 패킷 헤더는 추가하지 않습니다.</desc>
    <!--SCENE-->
  </svg>
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" data-action="play" aria-pressed="false">재생</button>
    <button class="btn" type="button" data-action="reset">처음으로</button>
  </div>
  <div class="text-small" data-status aria-live="polite">완료 · S1·S2·S3 적재 완료</div>
</div>
