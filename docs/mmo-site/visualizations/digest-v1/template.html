    <title id="digest-title">4번 그림 · 같은 패킷, 세션당 적재 요청 한 번</title>
    <desc id="digest-desc">같은 수신 섹터 R의 주민 S1과 S2는 같은 유효섹터를 봅니다. 변경 전에는 A 이동, B 채팅, C 이동의 기존 패킷을 각 주민의 SendQ에 하나씩 넣어 세션당 세 번 요청합니다. 변경 후에는 사건이 발생한 섹터에 패킷을 보류하고, 틱 끝에 수신 섹터 R의 유효섹터에서 기존 패킷 바이트를 한 번 이어붙여 Digest를 만듭니다. 새 패킷 헤더는 만들지 않습니다. 그 Digest를 주민마다 한 번씩 각자의 링버퍼로 복사합니다. 그림은 세 패킷과 주민 두 명의 예시이며, 노션 A/B 실측은 동접 4,000에서 적재 요청 약 18만에서 4천 회/tick입니다. 뒤이은 WSASend 코얼레싱은 양쪽에 이미 적용되어 있습니다.</desc>
