<style>
/*STYLES*/

#quantization-figure-five-morph-v2 .comparison-board {display:block;width:100%;height:auto;background:var(--pcb-bg)}

<div id="quantization-figure-five-morph-v2" aria-label="5번 그림 · 좌표 양자화와 방향·상태 패킹">
  <div class="comparison-panels">
    <svg class="comparison-board" data-board="before" xmlns="http://www.w3.org/2000/svg" width="736" height="456" viewBox="0 0 736 456" role="img" aria-labelledby="quant-before-title quant-before-desc">
      <title id="quant-before-title">변경 전 · 플레이어 한 명분 14바이트</title>
      <desc id="quant-before-desc">같은 플레이어가 오른쪽으로 한 타일 이동합니다. 서버 내부 좌표와 전송 좌표 모두 float입니다. ID 4바이트, x와 y 각각 4바이트, 방향과 이동 상태 각각 1바이트로 한 엔트리는 14바이트입니다. 그림은 필드 크기 비교를 위해 관련 필드를 묶은 구성도이며 실제 와이어 순서는 ID, 방향, 상태, x, y입니다. 공통 헤더 4바이트와 count 2바이트를 포함한 100명 묶음 패킷은 1406바이트입니다. 이동 시간을 설명하는 그림이 아니라 직렬화 표현을 설명하는 예시입니다.</desc>
      <!--BEFORE-->
    </svg>
    <svg class="comparison-board" data-board="after" xmlns="http://www.w3.org/2000/svg" width="736" height="456" viewBox="0 0 736 456" role="img" aria-labelledby="quant-after-title quant-after-desc">
      <title id="quant-after-title">변경 후 · 전송 직전 눈금으로 변환해 9바이트</title>
      <desc id="quant-after-desc">동일한 이동과 동일한 서버 float 좌표를 사용합니다. Msg 내부에서 x와 y의 4칸짜리 표현을 보여준 뒤 각각 2칸으로 줄이고, x와 y를 qx와 qy로 바꾸며 float 값을 반올림한 눈금 값으로 바꿉니다. 축소된 좌표를 1150밀리초 이상 유지하고 ID와 방향·상태는 중립색으로 표시합니다. 이 장면은 전송 표현을 비교하는 도식이며, 실제 코드가 Msg에 float을 먼저 기록한 뒤 그 버퍼를 축소한다는 뜻은 아닙니다. 실제 MakeSectorUpdates는 양자화한 uint16을 직접 직렬화합니다. 직렬화 직전에 512를 곱하고 반올림해 x와 y를 각각 uint16 눈금 qx와 qy로 바꿉니다. x 73.12570은 qx 37440, y 24.33333은 qy 12459가 됩니다. 클라이언트는 512로 나누어 근사 좌표를 복원하고, 일반 범위의 최대 반올림 오차는 1/1024타일입니다. 서버 좌표가 눈금에 맞춰 이동하거나 정수로 변경되는 것은 아닙니다. 방향 RIGHT 4는 하위 니블, MOVING 1은 상위 니블에 담겨 0x14 한 바이트가 됩니다. ID 4바이트, qx 2바이트, qy 2바이트, 방향·상태 1바이트로 9바이트입니다. 실제 와이어 순서는 ID, qx, qy, dirState입니다. 헤더와 count를 포함한 100명 묶음은 906바이트이며, 최대 엔트리 100개와 패킷 개수는 이 최적화에서 바꾸지 않습니다. 채팅과 다른 패킷 전체를 양자화한다는 설명은 아닙니다.</desc>
      <!--AFTER-->
    </svg>
