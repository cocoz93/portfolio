<section id="bundle-routing-bus" class="study-design" data-variant="버스 레일형" data-routing="bus" data-layout="silkscreen" aria-label="버스 레일형">
    <svg class="study-board" xmlns="http://www.w3.org/2000/svg" width="736" height="548" viewBox="0 0 736 548" role="img" aria-labelledby="routing-studies-title routing-studies-desc">
      <title id="routing-studies-title">버스 레일형</title>
      <desc id="routing-studies-desc">2번 그림: 같은 이동 메시지 네 개를 Msg 하나로 묶는 비교입니다. 변경 전에는 개별 Msg 1부터 4까지 나열합니다. 변경 후에는 Msg라는 이름을 바깥 직렬화버퍼에 한 번만 표시하고, 내부 사각형 네 개는 이동 좌표 데이터만 나타냅니다. 1번 그림 원본의 네이비 배경과 하늘색 강조를 유지했습니다. 변경 전에는 하나의 버스 레일에서 네 개 Msg로 분기하며 각 Msg를 순서대로 SendQ에 복사합니다. 변경 후에는 하나의 Msg 부품을 왼쪽 입력과 오른쪽 출력으로 직접 연결합니다. 공유 배선은 개별 Msg를 합치는 처리가 아닙니다. 캐릭터, Msg, SendQ의 위치와 크기를 유지하며 버스 레일과 짧은 분기 접점으로 연결합니다. 네 개 이동 데이터의 입력은 서로 교차하지 않는 평행 배선과 원형 접점으로 표시합니다. 넓은 화면에서는 접점을 부품 가까이 옮기고 세로 구간과 배선 간격을 줄여 촘촘하게 정리했습니다. 변경 전에는 네 개 Msg가 각 출력 배선을 지나며, 변경 후에는 묶음 Msg가 한 개 출력 배선을 지납니다. 배선 수는 WSASend 호출 횟수를 나타내지 않습니다. 이동 좌표 (0,1), (1,1), (1,0), (2,0)는 전후에 같은 순서로 보존됩니다. Msg 채우기는 0.35초이며 캐릭터 이동과 SendQ 적재는 0.65초입니다. 맵의 방향 화살표는 해당 칸을 이동하는 동안에만 표시됩니다. SendQ 옆의 WSASend 출구에는 커널 경계선이 있습니다. 송신 요청 시 더 큰 직사각형 데이터 신호가 경계를 통과하고, 이후 큐 불빛이 꺼집니다. 이는 커널 송신 요청을 나타내며 수신 완료나 WSASend 호출 횟수 비교를 의미하지 않습니다. 원형 큐는 바이트 링버퍼의 도식입니다. 좁은 화면에서는 메시지를 세로로 재배치합니다. 구도 보기와 수동 재생을 지원합니다.</desc>
      <!-- SCENE_BUS -->
    </svg>

      <desc id="routing-side-desc">2번 그림: 어두운 네이비 배경과 기존의 촘촘한 PCB 배선을 유지하고 1번 그림의 하늘색 강조를 유지하고 부품 측면의 직사각형 핀으로 연결합니다. 변경 후 Msg에는 네 개의 짧은 입력선과 하나의 출력선이 있습니다. 변경 전에는 개별 Msg 네 개, 변경 후에는 네 개의 이동 좌표를 순서대로 담은 Msg 한 개를 한 수신 세션의 SendQ에 복사합니다. 내부 사각형은 좌표 데이터이며 각각 독립된 Msg가 아닙니다. 좌표 (0,1), (1,1), (1,0), (2,0)는 모두 보존됩니다. WSASend 신호가 커널 경계를 통과한 후 큐가 비워집니다. 수신 완료나 WSASend 호출 횟수 비교를 나타내지 않습니다. 재생을 누르면 변경 전 다음 변경 후가 순서대로 움직입니다.</desc>

    <svg class="study-board" xmlns="http://www.w3.org/2000/svg" width="736" height="548" viewBox="0 0 736 548" role="img" aria-labelledby="routing-chamfer-title routing-chamfer-desc">
      <title id="routing-chamfer-title">사선 팬아웃형</title>
      <desc id="routing-chamfer-desc">2번 그림: 어두운 네이비 배경과 기존의 촘촘한 PCB 배선을 유지하고 1번 그림의 하늘색 강조를 유지하고 평행 배선의 모서리를 45도로 꺾습니다. 원형 패드와 짧은 측면 출력선으로 실제 PCB의 팬아웃 형태를 나타냅니다. 변경 전에는 개별 Msg 네 개, 변경 후에는 네 개의 이동 좌표를 순서대로 담은 Msg 한 개를 한 수신 세션의 SendQ에 복사합니다. 내부 사각형은 좌표 데이터이며 각각 독립된 Msg가 아닙니다. 좌표 (0,1), (1,1), (1,0), (2,0)는 모두 보존됩니다. WSASend 신호가 커널 경계를 통과한 후 큐가 비워집니다. 수신 완료나 WSASend 호출 횟수 비교를 나타내지 않습니다. 재생을 누르면 변경 전 다음 변경 후가 순서대로 움직입니다.</desc>

  <section id="bundle-routing-baseline" class="study-design" data-variant="현재 배선" data-routing="baseline" data-layout="silkscreen" aria-label="현재 배선" hidden>
    <svg class="study-board" xmlns="http://www.w3.org/2000/svg" width="736" height="548" viewBox="0 0 736 548" role="img" aria-labelledby="routing-baseline-title routing-baseline-desc">
      <title id="routing-baseline-title">현재 배선</title>
      <desc id="routing-baseline-desc">2번 그림: 1번 그림의 어두운 네이비 배경과 글자색을 유지하고 기존의 직교 평행 배선과 원형 접점을 비교 기준으로 표시합니다. 변경 전은 네 개의 개별 Msg를, 변경 후는 좌표 데이터 네 개를 순서대로 담은 하나의 Msg를 한 수신 세션의 SendQ에 복사합니다. 모든 좌표는 보존되며 내부 사각형은 독립된 Msg가 아닙니다. WSASend 신호가 커널 경계를 통과한 후 큐가 비워집니다. 수신 완료나 WSASend 호출 횟수 비교를 나타내지 않습니다. 재생하면 변경 전, 변경 후가 순서대로 움직입니다.</desc>

<script>
(() => {
  'use strict';
/* MATCHED_SOURCE */
  const root=document.getElementById('sector-bundle-routing-studies-v12');if(!root)return;
  const KIND='sector-bundle-routing-studies-v12';
  const reduced=typeof matchMedia==='function'?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false,addEventListener(){}};
  const designs=Array.from(root.querySelectorAll('.study-design')),controllers=[];
  let drawnWidth=0,pendingWidth=0,layoutFrame=0;
  function save(){
    if(!window.openai?.setWidgetState)return;
    const snapshots=controllers.map(controller=>controller.snapshot());
    try{Promise.resolve(window.openai.setWidgetState({modelContent:{kind:KIND,designs:controllers.map(controller=>controller.state())},privateContent:{kind:KIND,designs:snapshots}})).catch(()=>{});}catch{}
  }
  for(const design of designs){
    const layout=design.getAttribute('data-layout'),routing=design.getAttribute('data-routing'),board=design.querySelector('.study-board');
    const playButton=design.querySelector('[data-action="play"]'),previewButton=design.querySelector('[data-action="preview"]'),status=design.querySelector('.study-status');
    let scene=null,program=createBundleProgram(false),time=program.end,playing=false,preview=true,raf=0,lastFrame=0,nodes=new Map();
    function set(id,attrs,text){
      const element=nodes.get(id);if(!element)throw Error(`Missing diagram element: ${id}`);
      for(const [key,value] of Object.entries(attrs))if(element.getAttribute(key)!==String(value))element.setAttribute(key,String(value));
      if(text!==undefined&&element.textContent!==text)element.textContent=text;
    }
    function frame(){return preview?bundlePreviewFrame(program):bundleFrame(time,program);}
    function paint(){
      if(!scene)return;const current=frame();applyBundleFrame(scene,current,set);
      if(status.textContent!==current.phase)status.textContent=current.phase;
      playButton.textContent=playing?'일시정지':time>0&&time<program.end&&!preview?'이어서 재생':'재생';
      playButton.setAttribute('aria-label',playing?'애니메이션 일시정지':`${design.getAttribute('data-variant')} 애니메이션 재생`);
    }
    function state(){const f=frame();return {layout,routing,name:design.getAttribute('data-variant'),time,duration:program.end,playing,preview,phase:f.phase,outboundMsgsBefore:f.rows[0].copies,outboundMsgsAfter:f.rows[1].copies,containedMovesBefore:f.rows[0].packets.filter(v=>v>=1).length,containedMovesAfter:f.rows[1].packets.filter(v=>v>=1).length,queuedBefore:f.rows[0].release>=1?0:f.rows[0].copies,queuedAfter:f.rows[1].release>=1?0:f.rows[1].copies};}
    function pause(){playing=false;lastFrame=0;if(raf)cancelAnimationFrame(raf);raf=0;paint();}
    function schedule(){if(playing&&!raf)raf=requestAnimationFrame(tick);}
    function tick(now){
      raf=0;if(!playing)return;
      if(document.hidden||design.hidden){lastFrame=0;schedule();return;}
      if(lastFrame)time=Math.min(program.end,time+Math.min(80,Math.max(0,now-lastFrame)));lastFrame=now;
      if(time>=program.end){playing=false;lastFrame=0;paint();save();return;}paint();schedule();
    }
    function play(){
      if(reduced.matches){pause();preview=true;time=program.end;paint();return;}
      if(preview||time>=program.end)time=0;preview=false;playing=true;lastFrame=0;paint();schedule();
    }
    function showPreview(){pause();time=program.end;preview=true;paint();}
    function renderDesign(width){
      const position=locateBundleSegment(time,program),atEnd=time>=program.end;
      const accessible=Array.from(board.children).filter(el=>['title','desc'].includes(el.tagName.toLowerCase()));
      scene=createBundleAnimationScene(width,layout,routing);program=createBundleProgram(scene.compact);
      time=atEnd?program.end:program.segments[position.index].start+position.progress*program.segments[position.index].duration;
      board.replaceChildren(...accessible);board.insertAdjacentHTML('beforeend',scene.markup);
      board.setAttribute('viewBox',`0 0 ${width} ${scene.height}`);board.setAttribute('width',String(width));board.setAttribute('height',String(scene.height));
      nodes=new Map(Array.from(board.querySelectorAll('[id]')).map(el=>[el.id,el]));lastFrame=0;paint();
    }
    function snapshot(){const p=locateBundleSegment(time,program);return {layout,routing,segment:p.index,phaseProgress:p.progress,playing,preview};}
    function restore(saved){
      if(saved?.layout!==layout||saved?.routing!==routing||!Number.isInteger(saved.segment)||saved.segment<0||saved.segment>=program.segments.length||!Number.isFinite(saved.phaseProgress))return;
      pause();const segment=program.segments[saved.segment];time=segment.start+bundleClamp(saved.phaseProgress)*segment.duration;preview=Boolean(saved.preview);
      if(reduced.matches){preview=true;time=program.end;}
      playing=!preview&&!reduced.matches&&Boolean(saved.playing)&&time<program.end;paint();schedule();
    }
    const controller={draw:renderDesign,state,snapshot,restore};controllers.push(controller);
    design.animation=Object.freeze({getState:state,play,pause,preview:showPreview,seek(ms){pause();preview=false;time=bundleClamp(Number.isFinite(ms)?ms:0,0,program.end);paint();return state();},getProgram:()=>program});
    playButton.addEventListener('click',()=>{playing?pause():play();save();});previewButton.addEventListener('click',()=>{showPreview();save();});
    document.addEventListener('visibilitychange',()=>{lastFrame=0;});
    reduced.addEventListener('change',()=>{if(reduced.matches)showPreview();});
  }
  function draw(width){
    if(!Number.isFinite(width)||width<=0)return;width=Math.max(320,width);
    if(Math.abs(width-drawnWidth)<.5)return;controllers.forEach(controller=>controller.draw(width));drawnWidth=width;
  }
  function restore(snapshot){if(snapshot?.privateContent?.kind!==KIND)return;for(const controller of controllers)controller.restore(snapshot.privateContent.designs?.find(entry=>entry.layout===controller.state().layout&&entry.routing===controller.state().routing));}
  draw(root.getBoundingClientRect().width||736);restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(entries=>{
    pendingWidth=entries[0].contentRect.width;if(layoutFrame)return;
    layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;draw(pendingWidth);});
  }).observe(root);
})();
</script>
