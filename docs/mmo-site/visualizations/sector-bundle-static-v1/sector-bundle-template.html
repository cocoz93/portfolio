<style>
/* EMBEDDED_FONTS */
#sector-bundle-pcb-static-v1 {
  --pcb-bg: #0d1421;
  --pcb-surface: #151f2c;
  --pcb-edge: #354b61;
  --pcb-track: #7895ae;
  --pcb-text: #eef2fb;
  --pcb-muted: #a8b8ca;
  --pcb-active: #6cc7ff;
  --pcb-soft: #1b3a50;
  --pcb-empty: #172536;
  --pcb-pin: #829bb1;
  --pcb-char-ink: #08121e;
  --pcb-char-steel: #dce9f3;
  --pcb-char-steel-dark: #617e9a;
  --pcb-char-blue-mid: #2579ad;
  --pcb-char-blue-dark: #17466a;
  --pcb-char-skin: #ecd0b5;
  --pcb-char-skin-dark: #bd947a;
  color: var(--pcb-text);
  background: var(--pcb-bg);
  color-scheme: dark;
  width: 100%;
  font-family: PCB-Pretendard, "Malgun Gothic", sans-serif;
}
#sector-bundle-pcb-static-v1 .sector-bundle-board {
  display: block;
  width: 100%;
  height: auto;
}
#sector-bundle-pcb-static-v1 .sector-bundle-board text {
  font-family: PCB-Pretendard, "Malgun Gothic", sans-serif;
  font-weight: 500;
}
#sector-bundle-pcb-static-v1 .sector-bundle-board .bundle-mono {
  font-family: PCB-Mono, "Malgun Gothic", monospace;
  font-variant-numeric: tabular-nums;
}
</style>
<div id="sector-bundle-pcb-static-v1">
  <svg class="sector-bundle-board" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sector-bundle-static-title sector-bundle-static-description" viewBox="0 0 736 680" width="736" height="680">
    <title id="sector-bundle-static-title">섹터의 이동 상태를 새 묶음 패킷으로 적재하는 전후 비교</title>
    <desc id="sector-bundle-static-description">같은 틱에 한 섹터에서 움직인 네 플레이어 A, B, C, D를 비교합니다. 변경 전에는 네 개의 개별 이동 패킷을 수신 세션의 SendQ에 네 번 적재합니다. 변경 후에는 각 플레이어의 최종 상태를 엔트리로 담은 새 섹터 업데이트 패킷 하나를 만들고 같은 수신 세션에 한 번 적재합니다. 각자의 SendQ는 세션별로 존재하며 그림은 수신자 한 명의 예시입니다. 상한을 넘으면 청크로 나뉩니다. WSASend 호출 시점은 이번 비교의 대상이 아닙니다.</desc>
    <!-- INITIAL_BOARD -->
  </svg>
</div>
<script>
(() => {
  /* DIAGRAM_FUNCTION */
  const root = document.getElementById("sector-bundle-pcb-static-v1");
  if (!root) return;
  const board = root.querySelector(".sector-bundle-board");
  let pendingWidth = 0;
  let drawnWidth = 736;
  let layoutFrame = 0;
  function queueLayout(width) {
    if (!Number.isFinite(width) || width <= 0) return;
    pendingWidth = width;
    if (layoutFrame) return;
    layoutFrame = requestAnimationFrame(() => {
      layoutFrame = 0;
      if (Math.abs(pendingWidth - drawnWidth) < 0.5) return;
      drawnWidth = pendingWidth;
      const drawing = createSectorBundleDiagram(drawnWidth);
      const accessible = Array.from(board.children).filter(child => child.tagName === "title" || child.tagName === "desc");
      board.replaceChildren(...accessible);
      board.insertAdjacentHTML("beforeend", drawing.markup);
      board.setAttribute("viewBox", `0 0 ${drawnWidth} ${drawing.height}`);
      board.setAttribute("width", String(drawnWidth));
      board.setAttribute("height", String(drawing.height));
    });
  }
  const observer = new ResizeObserver(entries => {
    const entry = entries.find(item => item.target === root);
    if (entry) queueLayout(entry.contentRect.width);
  });
  observer.observe(root);
  queueLayout(root.getBoundingClientRect().width);
})();
</script>
