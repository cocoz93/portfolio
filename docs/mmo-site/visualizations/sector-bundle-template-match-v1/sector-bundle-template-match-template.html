<style>
/* ORIGINAL_FONTS */
#sector-bundle-template-match-v1 {
  --pcb-bg:#0d1421;--pcb-surface:#151f2c;--pcb-edge:#354b61;
  --pcb-track:#7895ae;--pcb-text:#eef2fb;--pcb-muted:#a8b8ca;
  --pcb-active:#6cc7ff;--pcb-soft:#1b3a50;--pcb-empty:#172536;--pcb-pin:#829bb1;
  --pcb-char-ink:#08121e;--pcb-char-steel:#dce9f3;--pcb-char-steel-dark:#617e9a;
  --pcb-char-blue-mid:#2579ad;--pcb-char-blue-dark:#17466a;--pcb-char-skin:#ecd0b5;--pcb-char-skin-dark:#bd947a;
  width:100%;color:var(--pcb-text);background:var(--pcb-bg);color-scheme:dark;
  font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;
}
#sector-bundle-template-match-v1 .bundle-matched-board {display:block;width:100%;height:auto}
#sector-bundle-template-match-v1 .bundle-matched-board text {font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;font-weight:500}
#sector-bundle-template-match-v1 .bundle-matched-board .bundle-mono {font-family:PCB-Mono,"Malgun Gothic",monospace;font-variant-numeric:tabular-nums}
</style>
<div id="sector-bundle-template-match-v1" aria-label="원본 WSASend 구성으로 맞춘 패킷 묶음 비교">
  <svg class="bundle-matched-board" xmlns="http://www.w3.org/2000/svg" width="736" height="478" viewBox="0 0 736 478" role="img" aria-labelledby="bundle-matched-title bundle-matched-description">
    <title id="bundle-matched-title">같은 상태, 세션당 Copy 네 번에서 한 번으로</title>
    <desc id="bundle-matched-description">위는 변경 전, 아래는 변경 후입니다. 두 그림에서 같은 섹터의 A, B, C, D 네 플레이어와 수신 세션 Q1, Q2, Q3를 비교합니다. 변경 전에는 이동 패킷 네 개를 각 세션 SendQ에 네 번 Copy합니다. 변경 후에는 새 헤더, count, 네 최종 상태 엔트리를 담는 새 묶음 패킷 하나를 각 세션 SendQ에 한 번 Copy합니다. 오른쪽의 큰 숫자는 각 수신 세션의 Copy 횟수입니다. WSASend 호출 횟수가 아니며 수신 세션의 큐는 각각 독립적입니다. Q1부터 Q3까지는 주변 시야의 수신자를 세 명으로 축약한 예시입니다. 정적 구도이며 아직 애니메이션을 넣지 않았습니다.</desc>
    <!-- MATCHED_SCENE -->
  </svg>
</div>
<script>
(() => {
/* MATCHED_SOURCE */
  const root=document.getElementById("sector-bundle-template-match-v1");
  if(!root)return;
  const board=root.querySelector(".bundle-matched-board");
  let drawnWidth=736,pendingWidth=0,layoutFrame=0;
  function queueLayout(width){
    if(!Number.isFinite(width)||width<=0)return;
    pendingWidth=Math.max(320,width);
    if(layoutFrame)return;
    layoutFrame=requestAnimationFrame(()=>{
      layoutFrame=0;
      if(Math.abs(pendingWidth-drawnWidth)<.5)return;
      drawnWidth=pendingWidth;
      const scene=createMatchedBundle(drawnWidth);
      const accessible=Array.from(board.children).filter(el=>["title","desc"].includes(el.tagName.toLowerCase()));
      board.replaceChildren(...accessible);board.insertAdjacentHTML("beforeend",scene.markup);
      board.setAttribute("viewBox",`0 0 ${drawnWidth} ${scene.height}`);
      board.setAttribute("width",String(drawnWidth));board.setAttribute("height",String(scene.height));
    });
  }
  if(typeof ResizeObserver!=="undefined")new ResizeObserver(entries=>queueLayout(entries[0].contentRect.width)).observe(root);
  queueLayout(root.getBoundingClientRect().width);
})();
</script>
