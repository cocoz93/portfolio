<style>
/* ORIGINAL_FONTS */
#serial-sector-zero-v6 {
  --pcb-bg:#0d1421;--pcb-surface:#151f2c;--pcb-edge:#354b61;--pcb-track:#7895ae;--pcb-text:#eef2fb;--pcb-muted:#a8b8ca;
  --pcb-active:#238fff;--pcb-data-focus:#0066d6;--pcb-soft:#1b3a50;--pcb-empty:#172536;--pcb-pin:#829bb1;
  --pcb-char-ink:#08121e;--pcb-char-steel:#dce9f3;--pcb-char-steel-mid:#a6bed1;--pcb-char-steel-dark:#617e9a;
  --pcb-char-blue:#4eafe8;--pcb-char-blue-mid:#2579ad;--pcb-char-blue-dark:#17466a;--pcb-char-skin:#ecd0b5;--pcb-char-skin-dark:#bd947a;
  width:100%;
}
#serial-sector-zero-v6 .sector-board {display:block;width:100%;height:auto;background:var(--pcb-bg)}
#serial-sector-zero-v6 .sector-board text {font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;font-weight:500}
#serial-sector-zero-v6 .sector-state-line {min-height:3em}
</style>
<div id="serial-sector-zero-v6" aria-label="9개 섹터와 Msg 재사용 러프">
  <svg class="sector-board" xmlns="http://www.w3.org/2000/svg" width="736" height="748" viewBox="0 0 736 748" role="img" aria-labelledby="sector-zero-title sector-zero-desc">
    <title id="sector-zero-title">섹터 이동 후 같은 Msg 재사용</title>
    <desc id="sector-zero-desc">아홉 칸은 게임 섹터를 나타냅니다. 캐릭터 A가 가운데 섹터에서 오른쪽 섹터로 이동합니다. 선택된 유효 수신자 S1, S2, S3에게 동일한 A 정보를 전달하는 발신 경로를 비교합니다. 수신자와 배치는 설명용 예시이며 실제 AOI 범위 계산이나 GetSectorDiff 결과를 나타내지 않습니다. 실제 섹터 이동의 생성 알림은 새로 보게 된 섹터, 삭제 알림은 이탈 섹터 주민을 대상으로 합니다. 이 그림은 선택된 대상들에게 같은 내용을 보내는 버퍼 공유 원리에 집중합니다. 변경 전에는 수신자마다 풀에서 Alloc하고 내용을 직렬화한 Msg를 SendQ에 Copy한 뒤 풀에 반환합니다. 변경 후에는 한 번 Alloc·직렬화한 같은 Msg에 AddRef(3)으로 수신자 몫을 확보하여 세 번 사용합니다. 각 SendQ는 바이트 사본을 보관하며 Copy 직후 SubRef합니다. 초기 Ref 1, AddRef 후 4, 각 Copy 후 3, 2, 1, 마지막 빌더 몫 SubRef 후 0이면 풀 반환합니다. 원본 Msg는 세 번의 Copy 동안 같은 위치에 유지됩니다. 이 코드는 intrusive reference counting을 사용하며 std::shared_ptr 객체를 추가하는 그림이 아닙니다. 세 SendQ의 사본은 원본 반환 후에도 유지됩니다. 그림은 Phase 1 발신 버퍼 공유를 분리하여 설명하며 이후 digest나 실제 WSASend 횟수는 포함하지 않습니다. 정적 구도는 순차 사건을 펼친 개념도이며 풀의 세 슬롯은 반환 사건 표식으로 실제 풀 용량이나 실제 주소, 동시에 존재하는 객체 개수를 나타내지 않습니다.</desc>
    <!-- SECTOR_SCENE -->
  </svg>
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" data-sector-action="play" aria-pressed="false">재생</button>
    <button class="btn" type="button" data-sector-action="preview">구도 보기</button>
  </div>
  <div class="sector-state-line"><span class="sector-status text-small" aria-live="polite">같은 수신자 · 같은 A 정보 · Msg 생성 3회 → 1회</span></div>
</div>
<script>
(() => {
  'use strict';
/* SECTOR_SOURCE */
  const root=document.getElementById('serial-sector-zero-v6');if(!root)return;
  const board=root.querySelector('.sector-board'),play=root.querySelector('[data-sector-action="play"]'),previewButton=root.querySelector('[data-sector-action="preview"]'),status=root.querySelector('.sector-status');
  const program=createReuseProgram(),duration=program.end+1350,media=matchMedia('(prefers-reduced-motion: reduce)');let scene,nodes=new Map(),time=0,preview=true,playing=false,raf=0,last=0,lastWidth=0,resizeRaf=0,pendingWidth=0;
  function set(id,attrs,text){const el=nodes.get(id);if(!el)throw Error('Missing element '+id);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));if(text!==undefined)el.textContent=text;}
  function getState(){const f=sectorFrame(time,program,preview);return {kind:'serial-sector-zero-v6',figure:3,time,duration,preview,playing,phase:preview?'같은 수신자 · 같은 A 정보 · Msg 생성 3회 → 1회':f.phase,sectorCount:9,recipientExample:3,movement:'center-to-right',originalRetained:f.rows[1].messages[0].live,createdBefore:f.rows[0].created,createdAfter:f.rows[1].created,copiesBefore:f.rows[0].copies,copiesAfter:f.rows[1].copies,refAfter:f.rows[1].messages[0].ref,returnedAfter:f.rows[1].returned[0],queuedAfter:f.rows[1].queues.filter(q=>q.filled).length};}
  function save(){if(window.openai&&typeof window.openai.setWidgetState==='function')window.openai.setWidgetState({modelContent:getState(),privateContent:{kind:'serial-sector-zero-v6',time,preview}}).catch(()=>{});}
  function render(){if(!scene)return;const f=sectorFrame(time,program,preview);applySectorFrame(scene,f,set);const state=getState();if(status.textContent!==state.phase)status.textContent=state.phase;play.textContent=playing?'일시정지':preview?'재생':time>=duration?'다시 재생':'이어 재생';play.setAttribute('aria-pressed',String(playing));}
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;playing=false;last=0;}
  function tick(now){if(!playing)return;if(document.hidden){stop();render();return;}if(last)time=Math.min(duration,time+Math.min(100,Math.max(0,now-last)));last=now;render();if(time>=duration){stop();render();save();}else raf=requestAnimationFrame(tick);}
  play.addEventListener('click',()=>{if(playing)stop();else{if(preview||time>=duration)time=0;preview=false;if(media.matches)time=duration;else{playing=true;last=0;raf=requestAnimationFrame(tick);}}render();save();});
  previewButton.addEventListener('click',()=>{stop();time=0;preview=true;render();save();});
  root.animation={getState,seek(next){stop();preview=false;time=Math.max(0,Math.min(duration,Number(next)||0));render();}};
  function draw(width){if(!Number.isFinite(width)||width<=0)return;width=Math.max(320,Math.round(width));if(width===lastWidth)return;scene=createSectorReuseScene(width);const accessible=Array.from(board.children).filter(el=>['title','desc'].includes(el.tagName.toLowerCase()));board.replaceChildren(...accessible);board.insertAdjacentHTML('beforeend',scene.markup);board.setAttribute('width',String(width));board.setAttribute('height',String(scene.height));board.setAttribute('viewBox',`0 0 ${width} ${scene.height}`);nodes=new Map(Array.from(board.querySelectorAll('[id]')).map(el=>[el.id,el]));lastWidth=width;render();}
  function restore(state){const s=state&&state.privateContent;if(!s||s.kind!=='serial-sector-zero-v6')return;stop();time=Math.max(0,Math.min(duration,Number(s.time)||0));preview=s.preview!==false;render();}
  draw(root.getBoundingClientRect().width||736);restore(window.openai&&window.openai.widgetState);
  window.addEventListener('openai:set_globals',e=>restore(e.detail&&e.detail.globals&&e.detail.globals.widgetState));
  media.addEventListener('change',()=>{if(media.matches){stop();render();}});
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(entries=>{pendingWidth=entries[0].contentRect.width;if(resizeRaf)return;resizeRaf=requestAnimationFrame(()=>{resizeRaf=0;draw(pendingWidth);});}).observe(root);
})();
</script>
