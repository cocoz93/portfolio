  <section class="sharing-design" aria-label="3번 그림 · 직렬화버퍼 1회 생성과 AddRef SubRef">
    <svg class="sharing-board" xmlns="http://www.w3.org/2000/svg" width="736" height="672" viewBox="0 0 736 672" role="img" aria-labelledby="serial-sharing-title serial-sharing-desc">
      <title id="serial-sharing-title">3번 그림 · 같은 Msg를 여러 수신자에게 재사용</title>
      <desc id="serial-sharing-desc">수신자 3명을 예로 든 섹터 진입 아웃바운드 비교입니다. 변경 전에는 같은 캐릭터의 정보를 수신자마다 Alloc, 직렬화, Seal하여 독립된 Msg 세 개를 만듭니다. 각 버퍼는 초기 Ref 1, SendPacket의 AddRef로 2, SendQ에 복사 직후 SubRef로 1, 빌더 소유권 SubRef로 0이 되어 풀에 반환됩니다. 변경 후에는 동일한 Msg를 한 번만 생성하고 Seal합니다. 초기 Ref 1에 배치 AddRef(3)으로 세 수신자 몫을 확보해 Ref 4가 됩니다. 각 세션의 독립된 링버퍼 SendQ에 같은 바이트를 복사한 직후 SubRef하여 3, 2, 1로 줄고, 최종 빌더 소유권 SubRef로 0이면 풀에 반환됩니다. SendQ에는 바이트 사본이 남습니다. 현재 USE_LOCKFREE_SENDQ=0 경로에 맞춘 그림이며, 포인터 큐의 zero-copy 및 송신 완료 후 회수를 나타내지 않습니다. 생성과 직렬화는 수신자 수 N회에서 1회로 줄지만 세션별 SendQ 적재 횟수와 수신자는 동일합니다. 이 그림은 P1 FanoutToSectors의 공유 원리를 설명하며 현재 추가로 켜진 digest 최적화는 별도입니다. 풀 반환은 delete가 아닙니다. 헤더와 데이터의 도형 크기는 바이트 비율이 아닙니다. 정지한 마법사는 정면, 이동 중에는 이동 방향을 봅니다. 변경 전과 변경 후를 순서대로 재생하며 다른 쪽은 회색으로 꺼집니다. 점등은 40밀리초에 켜지고 500밀리초 동안 완전히 밝게 유지한 뒤 350밀리초에 원래 파랑으로 돌아옵니다. Ref는 Header 또는 송신 데이터에 포함되지 않는 버퍼 관리용 메타데이터입니다. 변경 전은 세 개 Msg를 나란히, 변경 후는 같은 크기의 Msg 하나와 별도의 큰 Ref 표시로 구성합니다. 빌더, S1, S2, S3 칸은 참조 소유권이며 SendQ에 Copy가 끝날 때 해당 세션 칸이 꺼집니다. 마지막 빌더 몫을 SubRef하면 버퍼 풀로 반환되는 경로가 나타납니다. 송신 데이터는 원래 Msg를 유지한 채 매번 밝게 점등되어 각 SendQ로 복사됩니다. 세션 링버퍼는 작게 배치하고 같은 세션별 바이트 사본이 남도록 합니다. 버퍼 풀로 향하는 신호는 소유권 반환 설명이며 네트워크 송신 또는 추가 데이터 복사가 아닙니다. 구도 보기는 생성된 버퍼 수를 비교하는 정적 배치이며 실행 타임라인의 단일 프레임이 아닙니다.</desc>
