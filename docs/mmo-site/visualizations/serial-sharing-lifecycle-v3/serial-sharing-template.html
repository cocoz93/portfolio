<style>
/* ORIGINAL_FONTS */
#serial-sharing-lifecycle-v3 {
  --pcb-bg:#0d1421;--pcb-surface:#151f2c;--pcb-edge:#354b61;
  --pcb-track:#7895ae;--pcb-text:#eef2fb;--pcb-muted:#a8b8ca;
  --pcb-active:#238fff;--pcb-data-focus:#0066d6;--pcb-soft:#1b3a50;--pcb-empty:#172536;--pcb-pin:#829bb1;
  --pcb-char-ink:#08121e;--pcb-char-steel:#dce9f3;--pcb-char-steel-mid:#a6bed1;--pcb-char-steel-dark:#617e9a;--pcb-char-blue:#4eafe8;
  --pcb-char-blue-mid:#2579ad;--pcb-char-blue-dark:#17466a;--pcb-char-skin:#ecd0b5;--pcb-char-skin-dark:#bd947a;
  width:100%;color:var(--pcb-text);font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;
}
#serial-sharing-lifecycle-v3 .sharing-design {width:100%;background:var(--pcb-bg);color-scheme:dark}
#serial-sharing-lifecycle-v3 .sharing-board {display:block;width:100%;height:auto}
#serial-sharing-lifecycle-v3 .sharing-board text {font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;font-weight:500}
#serial-sharing-lifecycle-v3 .bundle-mono {font-family:PCB-Mono,"Malgun Gothic",monospace;font-variant-numeric:tabular-nums}
#serial-sharing-lifecycle-v3 .sharing-toolbar {padding:12px 20px}
#serial-sharing-lifecycle-v3 .sharing-status {font-size:12px;color:var(--pcb-muted);flex:1 1 250px;text-align:right}
</style>
<div id="serial-sharing-lifecycle-v3">
  <section class="sharing-design" aria-label="3번 그림 · 직렬화버퍼 1회 생성과 AddRef SubRef">
    <svg class="sharing-board" xmlns="http://www.w3.org/2000/svg" width="736" height="744" viewBox="0 0 736 744" role="img" aria-labelledby="serial-sharing-title serial-sharing-desc">
      <title id="serial-sharing-title">3번 그림 · 같은 Msg를 여러 수신자에게 재사용</title>
      <desc id="serial-sharing-desc">수신자 3명을 예로 든 섹터 진입 아웃바운드 비교입니다. 변경 전에는 같은 캐릭터의 정보를 수신자마다 Alloc, 직렬화, Seal하여 독립된 Msg 세 개를 만듭니다. 각 버퍼는 초기 Ref 1, SendPacket의 AddRef로 2, SendQ에 복사 직후 SubRef로 1, 빌더 소유권 SubRef로 0이 되어 풀에 반환됩니다. 변경 후에는 동일한 Msg를 한 번만 생성하고 Seal합니다. 초기 Ref 1에 배치 AddRef(3)으로 세 수신자 몫을 확보해 Ref 4가 됩니다. 각 세션의 독립된 링버퍼 SendQ에 같은 바이트를 복사한 직후 SubRef하여 3, 2, 1로 줄고, 최종 빌더 소유권 SubRef로 0이면 풀에 반환됩니다. SendQ에는 바이트 사본이 남습니다. 현재 USE_LOCKFREE_SENDQ=0 경로에 맞춘 그림이며, 포인터 큐의 zero-copy 및 송신 완료 후 회수를 나타내지 않습니다. 생성과 직렬화는 수신자 수 N회에서 1회로 줄지만 세션별 SendQ 적재 횟수와 수신자는 동일합니다. 이 그림은 P1 FanoutToSectors의 공유 원리를 설명하며 현재 추가로 켜진 digest 최적화는 별도입니다. 풀 반환은 delete가 아닙니다. 헤더와 데이터의 도형 크기는 바이트 비율이 아닙니다. 캐릭터는 정보 출처를 나타내며 정면을 봅니다. 별도의 지도는 표시하지 않습니다. 변경 전과 변경 후를 순서대로 재생하며 다른 쪽은 회색으로 꺼집니다. 점등은 40밀리초에 켜지고 500밀리초 동안 완전히 밝게 유지한 뒤 350밀리초에 원래 파랑으로 돌아옵니다. 전후의 정보 출처, 중앙 Msg 자리, 세션별 SendQ, 배선은 동일합니다. 중앙 Msg 자리는 하나이며, 변경 전에는 세 수신자마다 그 자리에서 Msg 1, 2, 3을 생성, 복사, 반환합니다. 변경 후에는 Msg 하나가 세 복사 동안 제자리에 유지됩니다. 복사는 원본을 제거하지 않습니다. Ref는 네트워크 Header가 아닌 관리용 참조 수로, 변경 후에만 Msg 아래에 표시합니다. 별도 Ref 기판과 참조 소유권 칸은 없습니다. 마지막 Ref 0에서 중앙 버퍼가 사라지고 풀 반환 경로를 표시합니다. 변경 전도 각 사이클의 Ref 0에서 풀로 반환합니다. 풀 반환 신호는 네트워크 데이터 복사가 아닙니다. 구도 보기는 반복 생성 3회와 단일 생성 1회를 비교하는 정적 배치이며 실행 타임라인의 단일 프레임이 아닙니다.</desc>
      <!-- INITIAL_SCENE -->
    </svg>
    <div class="viz-controls sharing-toolbar">
      <button type="button" class="btn" data-action="play" aria-label="3번 그림 애니메이션 재생">재생</button>
      <button type="button" class="btn" data-action="preview">구도 보기</button>
      <span class="sharing-status" role="status" aria-live="polite">같은 정보 · 수신자 3명 예시 · 생성·직렬화 3회 → 1회</span>
    </div>
  </section>
</div>
<script>
(() => {
  'use strict';
/* MATCHED_SOURCE */
  const KIND='serial-sharing-lifecycle-v3',root=document.getElementById(KIND);if(!root)return;
  const design=root.querySelector('.sharing-design'),board=design.querySelector('.sharing-board'),playButton=design.querySelector('[data-action="play"]'),previewButton=design.querySelector('[data-action="preview"]'),status=design.querySelector('.sharing-status');
  const reduced=typeof matchMedia==='function'?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false,addEventListener(){}};
  let scene=null,program=createRefProgram(),time=program.end,preview=true,playing=false,raf=0,last=0,width=0,nodes=new Map(),layoutRaf=0,nextWidth=0;
  function set(id,attrs,text){const el=nodes.get(id);if(!el)throw Error(`Missing diagram element: ${id}`);for(const [k,v] of Object.entries(attrs))if(el.getAttribute(k)!==String(v))el.setAttribute(k,String(v));if(text!==undefined&&el.textContent!==text)el.textContent=text;}
  function frame(){return preview?refPreview(program):refFrame(time,program);}
  function paint(){if(!scene)return;const f=frame();applyRefFrame(scene,f,set);if(status.textContent!==f.phase)status.textContent=f.phase;const label=playing?'일시정지':!preview&&time>0&&time<program.end?'이어서 재생':'재생';if(playButton.textContent!==label)playButton.textContent=label;playButton.setAttribute('aria-label',playing?'애니메이션 일시정지':'3번 그림 애니메이션 재생');}
  function state(){const f=frame();return {kind:KIND,figure:3,recipientExample:3,playing,preview,time,duration:program.end,phase:f.phase,createdBefore:f.rows[0].builds,createdAfter:f.rows[1].builds,copiesBefore:f.rows[0].copies,copiesAfter:f.rows[1].copies,refsBefore:f.rows[0].packets.map(p=>p.ref),refAfter:f.rows[1].packets[0].ref,queuedBefore:f.rows[0].queues.filter(q=>q>=1).length,queuedAfter:f.rows[1].queues.filter(q=>q>=1).length};}
  function snapshot(){return {kind:KIND,time,preview,playing};}
  function save(){if(!window.openai?.setWidgetState)return;try{Promise.resolve(window.openai.setWidgetState({modelContent:state(),privateContent:snapshot()})).catch(()=>{});}catch{}}
  function pause(){playing=false;last=0;if(raf)cancelAnimationFrame(raf);raf=0;paint();}
  function schedule(){if(playing&&!raf)raf=requestAnimationFrame(tick);}
  function tick(now){raf=0;if(!playing)return;if(document.hidden||design.hidden){last=0;schedule();return;}if(last)time=Math.min(program.end,time+Math.min(80,Math.max(0,now-last)));last=now;if(time>=program.end){playing=false;last=0;paint();save();return;}paint();schedule();}
  function play(){if(reduced.matches){pause();preview=true;time=program.end;paint();return;}if(preview||time>=program.end)time=0;preview=false;playing=true;last=0;paint();schedule();}
  function showPreview(){pause();time=program.end;preview=true;paint();}
  function draw(value){if(!Number.isFinite(value)||value<=0)return;value=Math.max(320,Math.round(value));if(value===width)return;scene=createRefScene(value);const accessible=Array.from(board.children).filter(el=>['title','desc'].includes(el.tagName.toLowerCase()));board.replaceChildren(...accessible);board.insertAdjacentHTML('beforeend',scene.markup);board.setAttribute('viewBox',`0 0 ${value} ${scene.height}`);board.setAttribute('width',value);board.setAttribute('height',scene.height);nodes=new Map(Array.from(board.querySelectorAll('[id]')).map(el=>[el.id,el]));width=value;last=0;paint();}
  function restore(saved){const s=saved?.privateContent;if(s?.kind!==KIND||!Number.isFinite(s.time))return;pause();time=refClamp(s.time,0,program.end);preview=Boolean(s.preview);playing=Boolean(s.playing)&&!preview&&time<program.end&&!reduced.matches;if(reduced.matches){preview=true;time=program.end;}paint();schedule();}
  design.animation=Object.freeze({getState:state,getProgram:()=>program,play,pause,preview:showPreview,seek(ms){pause();preview=false;time=refClamp(Number.isFinite(ms)?ms:0,0,program.end);paint();return state();}});
  playButton.addEventListener('click',()=>{playing?pause():play();save();});previewButton.addEventListener('click',()=>{showPreview();save();});document.addEventListener('visibilitychange',()=>{last=0;});reduced.addEventListener('change',()=>{if(reduced.matches){showPreview();save();}});
  draw(root.getBoundingClientRect().width||736);restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(entries=>{nextWidth=entries[0].contentRect.width;if(layoutRaf)return;layoutRaf=requestAnimationFrame(()=>{layoutRaf=0;draw(nextWidth);});}).observe(root);
})();
</script>
