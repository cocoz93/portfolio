<style>
/* STUDY_FONTS */
#wsasend-pcb-studies-v1 .pcb-study-board {display:block;width:100%;height:auto}
#wsasend-pcb-studies-v1 .pcb-study-board text {font-family:PCB-Pretendard,"Malgun Gothic",sans-serif;font-weight:500}
#wsasend-pcb-studies-v1 .pcb-study-board .pcb-study-mono {font-family:PCB-Mono,"Malgun Gothic",monospace}
</style>
<div id="wsasend-pcb-studies-v1" class="viz-carousel" aria-label="WSASend PCB 디자인 시안" data-previous-label="이전 시안" data-next-label="다음 시안">
  <section data-variant="솔더마스크 기판" aria-label="솔더마스크 기판 디자인">
    <svg class="pcb-study-board" data-design="mask" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 506" width="736" height="506" role="img" aria-labelledby="pcb-study-mask-title pcb-study-mask-desc">
      <title id="pcb-study-mask-title">솔더마스크 기판</title>
      <desc id="pcb-study-mask-desc">초록 기판, 금색 납땜 패드, 도금 비아와 실크 인쇄 윤곽을 사용한 정적 시안입니다. 한 수신 세션에 보내는 네 이동 메시지의 개별 WSASend 호출 네 번과 틱 끝 묶음 호출 한 번을 비교합니다. 누적 큐는 송신 전에 네 개를 모으는 과정을 표현합니다.</desc>
      <!-- MASK_SCENE -->
    </svg>
  </section>
  <section data-variant="정밀 회로도" aria-label="정밀 회로도 디자인" hidden>
    <svg class="pcb-study-board" data-design="schematic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 506" width="736" height="506" role="img" aria-labelledby="pcb-study-schematic-title pcb-study-schematic-desc">
      <title id="pcb-study-schematic-title">정밀 회로도</title>
      <desc id="pcb-study-schematic-desc">네이비 바탕과 얇은 회로 윤곽, 접점과 미세 그리드를 사용한 정적 시안입니다. 같은 메시지 네 개를 변경 전에는 즉시 개별 송신하고 변경 후에는 틱 끝에 묶어서 송신합니다. WSASend는 커널 송신 요청을 나타냅니다.</desc>
      <!-- SCHEMATIC_SCENE -->
    </svg>
  </section>
  <section data-variant="칩 실장 보드" aria-label="칩 실장 보드 디자인" hidden>
    <svg class="pcb-study-board" data-design="assembly" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 506" width="736" height="506" role="img" aria-labelledby="pcb-study-assembly-title pcb-study-assembly-desc">
      <title id="pcb-study-assembly-title">칩 실장 보드</title>
      <desc id="pcb-study-assembly-desc">직각 단차가 있는 부품 패키지, 은색 핀과 캐리어에 실장된 원형 큐를 사용한 정적 시안입니다. 동일한 이동 메시지 네 개의 송신 요청을 네 번에서 한 번으로 모으는 구조를 비교합니다.</desc>
      <!-- ASSEMBLY_SCENE -->
    </svg>
  </section>
</div>
<script>
(() => {
/* SCENE_SOURCE */
  const magePixels=/* MAGE_PIXELS */;
  const root=document.getElementById("wsasend-pcb-studies-v1");
  if(!root)return;
  const boards=Array.from(root.querySelectorAll(".pcb-study-board"));
  let drawnWidth=736,pendingWidth=0,layoutFrame=0;
  function queueLayout(width){
    if(!Number.isFinite(width)||width<1)return;
    pendingWidth=Math.max(320,width);
    if(layoutFrame)return;
    layoutFrame=requestAnimationFrame(()=>{
      layoutFrame=0;
      if(Math.abs(pendingWidth-drawnWidth)<.5)return;
      drawnWidth=pendingWidth;
      for(const board of boards){
        const scene=createPcbStudy(drawnWidth,board.getAttribute("data-design"),magePixels);
        const descriptions=Array.from(board.children).filter(el=>el.tagName.toLowerCase()==="title"||el.tagName.toLowerCase()==="desc");
        board.replaceChildren(...descriptions);
        board.insertAdjacentHTML("beforeend",scene.markup);
        board.setAttribute("viewBox",`0 0 ${drawnWidth} ${scene.height}`);
        board.setAttribute("width",String(drawnWidth));
        board.setAttribute("height",String(scene.height));
      }
    });
  }
  if(typeof ResizeObserver!=="undefined")new ResizeObserver(entries=>queueLayout(entries[0].contentRect.width)).observe(root);
  queueLayout(root.getBoundingClientRect().width);
})();
</script>
